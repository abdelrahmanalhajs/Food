<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tk Classic | تي كي كلاسيك</title>
<meta name="theme-color" content="#1f1a17"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Tk Classic"><link rel="apple-touch-icon" href="logo.svg"><meta name="description" content="Tk Classic: أزياء وبيتيات وعبايات ولانجري وشنط وأحذية ومفروشات وأدوات منزلية وميكب وطرح وأطفالي — موقع تجريبي.">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#faf6f0;--card:#fff;--ink:#1f1a17;--mute:#7a6f66;--line:#eadfd0;--gold:#b8893b;--gold2:#c9a15a;--dark:#1f1a17;--rose:#b5485d;--ok:#2e7d4f}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
.topnote{background:var(--dark);color:#f3e6cc;text-align:center;font-size:13px;padding:6px 10px}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.hd{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.5px}
.logo img{width:40px;height:40px;border-radius:10px}.logo small{display:block;font-size:11px;font-weight:600;color:var(--gold);letter-spacing:2px;line-height:1}
.srch{flex:1;display:flex;max-width:520px;margin-inline:auto}
.srch input{flex:1;border:1px solid var(--line);border-radius:999px 0 0 999px;padding:9px 16px;font:inherit;background:var(--bg);min-width:0}
[dir=rtl] .srch input{border-radius:0 999px 999px 0}
.srch button{border:0;background:var(--gold);color:#fff;padding:0 18px;border-radius:0 999px 999px 0;font-size:16px}
[dir=rtl] .srch button{border-radius:999px 0 0 999px}
.ib{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;position:relative;white-space:nowrap}
.ib:hover{border-color:var(--gold)}
.bd{position:absolute;top:-6px;inset-inline-end:-4px;background:var(--rose);color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 4px}
.bd.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.5)}}
nav#cats{max-width:1200px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:thin}
nav#cats a{white-space:nowrap;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mute);border:1px solid transparent}
nav#cats a:hover{color:var(--ink);border-color:var(--line)}nav#cats a.on{background:var(--dark);color:#f3e6cc}
main{max-width:1200px;margin:0 auto;padding:18px 16px 40px;min-height:60vh}
.hero{background:linear-gradient(120deg,#1f1a17,#3a2a22 60%,#5a3a2a);color:#f3e6cc;border-radius:22px;padding:44px 32px;display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:center;overflow:hidden}
.hero h1{font-size:clamp(28px,5vw,46px);margin:0 0 8px;line-height:1.25}.hero h1 span{color:var(--gold2)}
.hero p{margin:0 0 18px;color:#d9c8a8;font-size:17px;max-width:520px}
.hero .art{font-size:110px;text-align:center;filter:drop-shadow(0 8px 20px #0006);letter-spacing:8px}
.btn{display:inline-block;background:var(--gold);color:#fff;border:0;border-radius:12px;padding:11px 22px;font-weight:700;font-size:15px}
.btn:hover{background:#a37a31}.btn.o{background:transparent;color:var(--ink);border:2px solid var(--ink)}.btn.dk{background:var(--dark)}
.btn.sm{padding:7px 14px;font-size:13px}.btn:disabled{opacity:.5}
h2.sec{font-size:24px;margin:30px 0 12px;display:flex;align-items:center;gap:10px}h2.sec a{margin-inline-start:auto;font-size:14px;color:var(--gold);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;font-weight:700;transition:.2s}
.tile:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 8px 20px #0001}
.tile .em{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;margin:0 auto 6px;font-size:32px;background:hsl(var(--h) 55% 90%)}
.tile small{display:block;color:var(--mute);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:.2s;position:relative}
.card:hover{box-shadow:0 10px 24px #0001;border-color:var(--gold2)}
.pimg{aspect-ratio:1/1;display:grid;place-items:center;font-size:72px;background:linear-gradient(145deg,hsl(var(--h) 60% 92%),hsl(calc(var(--h) + 25) 55% 82%))}
.card .in{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .nm{font-weight:700;font-size:15px;line-height:1.35}.card .ct{font-size:12px;color:var(--mute)}
.price{font-weight:800;color:var(--dark)}.price s{color:var(--mute);font-weight:500;font-size:13px;margin-inline-start:6px}
.tag{position:absolute;top:10px;inset-inline-start:10px;background:var(--rose);color:#fff;border-radius:8px;padding:2px 9px;font-size:12px;font-weight:700}
.stars{color:var(--gold);font-size:13px}.stars span{color:var(--mute);margin-inline-start:4px}
.card .add{margin-top:auto}
.crumb{font-size:13px;color:var(--mute);margin-bottom:8px}.crumb a{color:var(--gold);font-weight:700}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 16px}
.bar select,.bar input{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;background:var(--card)}
.bar .n{margin-inline-end:auto;color:var(--mute)}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.pd .pimg{border-radius:20px;font-size:180px;border:1px solid var(--line)}
.pd h1{margin:0 0 6px;font-size:28px}.pd .price{font-size:26px;margin:8px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 14px;font-weight:700}
.chip.on{background:var(--dark);color:#f3e6cc;border-color:var(--dark)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0;position:relative}.sw.on{outline:3px solid var(--gold);outline-offset:2px}
.lbl{font-weight:700;margin-top:10px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.qty button{border:0;background:none;width:34px;height:34px;font-size:18px}.qty b{min-width:30px;text-align:center}
.feat{color:var(--mute);padding-inline-start:18px;margin:14px 0}
.cartwrap{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.li{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}.li .pimg{font-size:34px;border-radius:12px}.li .x{border:0;background:none;color:var(--rose);font-size:20px}
.sum div{display:flex;justify-content:space-between;padding:5px 0}.sum .tot{font-size:20px;font-weight:800;border-top:2px solid var(--line);margin-top:6px;padding-top:10px}
.sum .ok{color:var(--ok)}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:12px}.frm label{display:flex;flex-direction:column;font-weight:700;font-size:14px;gap:4px}.frm .w{grid-column:1/-1}
.frm input,.frm select,.frm textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:var(--bg)}
.frm input.bad,.frm select.bad,.frm textarea.bad{border-color:var(--rose);background:#fff2f4}
.err{color:var(--rose);font-size:12px;font-weight:600;min-height:0}
.pay{display:flex;flex-direction:column;gap:8px}.pay label{flex-direction:row;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);font-weight:700;gap:10px}
.pay label.on{border-color:var(--gold);background:#fff8ea}
.steps{display:flex;gap:8px;margin:6px 0 16px;flex-wrap:wrap}.steps span{padding:4px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mute)}.steps .on{background:var(--dark);color:#f3e6cc;border-color:var(--dark)}
.done{text-align:center;padding:30px 10px}.done .ok{font-size:70px}.done h1{margin:6px 0}.done .no{display:inline-block;background:#fff8ea;border:1px dashed var(--gold);border-radius:12px;padding:8px 22px;font-size:22px;font-weight:800;letter-spacing:1px;margin:8px 0}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:30px}.perks div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;font-weight:700}.perks small{display:block;color:var(--mute);font-weight:500}
footer{background:var(--dark);color:#cdbd9f;padding:26px 16px;text-align:center;font-size:14px}footer b{color:#f3e6cc}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--dark);color:#f3e6cc;padding:10px 20px;border-radius:12px;font-weight:700;z-index:99;transition:.3s;opacity:0;pointer-events:none}#toast.on{transform:translateX(-50%);opacity:1}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
nav.tabbar{display:none}
@media(max-width:820px){nav.tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabbar a,nav.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:0;font:inherit;font-size:11px;font-weight:700;color:var(--mute);position:relative;padding:2px 0}
nav.tabbar .ti{font-size:22px;line-height:1.2}nav.tabbar .on{color:var(--gold)}nav.tabbar .bd{top:-2px;inset-inline-end:calc(50% - 22px)}
main{padding-bottom:84px}footer{padding-bottom:90px}.hd .ib#cartb{display:none}.topnote{font-size:12px}#toast{bottom:84px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.tiles{grid-template-columns:repeat(3,1fr);gap:8px}.tile{padding:10px 4px;font-size:13px}.tile .em{width:52px;height:52px;font-size:26px}.tile small{display:none}h2.sec{font-size:20px}.pd .pimg{font-size:120px}.pd h1{font-size:22px}.hero .art{display:none}.hero{padding:24px 18px}.hero h1{font-size:26px}.hero p{font-size:14px}}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding:28px 20px}.hero .art{font-size:70px}.pd,.cartwrap{grid-template-columns:1fr}.frm{grid-template-columns:1fr}.hd{flex-wrap:wrap}.srch{order:5;flex-basis:100%;max-width:none}.logo small{display:none}}
</style>
</head>

document.addEventListener('change',e=>{if(e.target.id==='sort'){SORT=e.target.value;render()}if(e.target.name==='pm'){document.querySelectorAll('.pay label').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));$('#cardbox').style.display=e.target.value==='card'?'grid':'none'}});
function place(){const v=id=>$(id).value.trim(),bad=(id,e,m)=>{$(id).classList.add('bad');$(e).textContent=m;return 1};document.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));document.querySelectorAll('.err').forEach(x=>{if(x.id.startsWith('e_'))x.textContent=''});let n=0;
 if(v('#f_n').length<3)n+=bad('#f_n','#e_n',t('eName'));if(!/^01[0125]\d{8}$/.test(v('#f_p').replace(/\s/g,'')))n+=bad('#f_p','#e_p',t('ePhone'));if(!v('#f_g'))n+=bad('#f_g','#e_g',t('eGov'));if(v('#f_a').length<5)n+=bad('#f_a','#e_a',t('eAddr'));
 const pm=document.querySelector('input[name=pm]:checked').value;if(pm==='card'&&v('#f_cn').replace(/\s/g,'').length<12)n+=bad('#f_cn','#e_cn',t('eCard'));if(n){const f=document.querySelector('.bad');if(f)f.scrollIntoView({block:'center'});return}
 const T0=totals();lastOrder={no:'TK-'+(100000+Math.floor(Math.random()*899999)),items:cart.map(i=>({...i})),total:T0.total,name:v('#f_n'),phone:v('#f_p'),gov:v('#f_g'),pm};
 try{localStorage.tk_order=JSON.stringify(lastOrder)}catch(e){}cart=[];coupon='';save();location.hash='#/done'}

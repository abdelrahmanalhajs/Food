<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدير تراخيص Scope</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f7f4;font-family:Cairo,"Segoe UI",Tahoma,system-ui,sans-serif;color:#17231c;padding:18px}.w{max-width:720px;margin:0 auto}.c{background:#fff;border:1px solid #e1e6df;border-radius:14px;padding:18px;margin:12px 0}h1{margin:0 0 4px}label{display:block;font-weight:700;margin-top:10px}input,textarea{width:100%;padding:10px;border:1px solid #ccd5ce;border-radius:10px;font:inherit;margin-top:4px}textarea{font:13px monospace;direction:ltr;height:130px}button{border:0;border-radius:10px;padding:10px 18px;font:700 15px inherit;background:#0f7a4d;color:#fff;cursor:pointer;margin-top:12px}.ok{color:#0f7a4d;font-weight:700}.err{color:#c92a2a;font-weight:700}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #eee;padding:6px;text-align:start}</style></head>
<body><div class="w"><h1>🔑 مدير تراخيص Scope</h1><p>للمالك فقط. بيشتغل على جهازك بدون إنترنت، والمفتاح الخاص مبيتبعتش لأي مكان.</p>
<div class="c"><b>1) حمّل ملف المفتاح الخاص</b> <span id="ks" class="err">لسه ما اتحملش</span><input type="file" id="kf"></div>
<div class="c"><b>2) أنشئ كود تفعيل لجهاز</b><label>رقم الجهاز (من شاشة التفعيل عند العميل)</label><input id="mid" dir="ltr" placeholder="XXXX-XXXX-XXXX-XXXX"><label>اسم العميل / الفرع</label><input id="nm"><label>تاريخ الانتهاء (اختياري — سيبه فاضي لو دائم)</label><input id="ex" type="date"><button id="go">إنشاء الكود</button><div id="msg"></div><textarea id="out" readonly placeholder="الكود هيظهر هنا"></textarea><button id="cp">📋 نسخ الكود</button></div>
<div class="c"><b>الأكواد اللي صدرتها (على الجهاز ده)</b><table id="hist"></table></div></div>
<script>
const $=s=>document.querySelector(s);let KEY=null;const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const hist=()=>{try{return JSON.parse(localStorage.scope_lic_hist||'[]')}catch(e){return[]}};const draw=()=>{$('#hist').innerHTML='<tr><th>التاريخ</th><th>العميل</th><th>رقم الجهاز</th><th>ينتهي</th></tr>'+hist().map(h=>`<tr><td>${h.d}</td><td>${h.n}</td><td dir="ltr">${h.m}</td><td>${h.e||'دائم'}</td></tr>`).join('')};draw();
$('#kf').onchange=async e=>{try{const t=(await e.target.files[0].text()).trim();const der=Uint8Array.from(atob(t),c=>c.charCodeAt(0));KEY=await crypto.subtle.importKey('pkcs8',der,{name:'Ed25519'},false,['sign']);$('#ks').className='ok';$('#ks').textContent='✓ تم تحميل المفتاح'}catch(er){KEY=null;$('#ks').className='err';$('#ks').textContent='ملف غير صالح أو المتصفح مش بيدعم Ed25519 (استخدم Chrome/Edge حديث أو أداة license.js)'}};
$('#go').onclick=async()=>{const m=$('#mid').value.trim().toUpperCase(),n=$('#nm').value.trim(),ex=$('#ex').value;$('#msg').innerHTML='';if(!KEY)return $('#msg').innerHTML='<span class="err">حمّل المفتاح الخاص الأول</span>';if(!/^[0-9A-F]{4}(-[0-9A-F]{4}){3}$/.test(m))return $('#msg').innerHTML='<span class="err">رقم الجهاز غلط (4 مجموعات من 4 حروف/أرقام)</span>';if(!n)return $('#msg').innerHTML='<span class="err">اكتب اسم العميل</span>';
const payload=new TextEncoder().encode(JSON.stringify({v:1,mid:m,name:n,exp:ex||null,iat:new Date().toISOString().slice(0,10)}));const sig=await crypto.subtle.sign('Ed25519',KEY,payload);$('#out').value=b64u(payload)+'.'+b64u(sig);$('#msg').innerHTML='<span class="ok">تم — ابعت الكود للعميل</span>';const h=hist();h.unshift({d:new Date().toISOString().slice(0,10),n,m,e:ex});localStorage.scope_lic_hist=JSON.stringify(h.slice(0,200));draw()};
$('#cp').onclick=()=>{$('#out').select();navigator.clipboard&&navigator.clipboard.writeText($('#out').value)};
</script></body></html>

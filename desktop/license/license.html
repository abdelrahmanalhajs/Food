<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>تفعيل Scope</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f7a4d,#0a4d31);font-family:Cairo,"Segoe UI",Tahoma,system-ui,sans-serif;color:#17231c;padding:16px}
.c{background:#fff;border-radius:18px;padding:28px;width:min(560px,100%);box-shadow:0 20px 60px #0006}h1{margin:0 0 4px;font-size:26px}p{color:#5d6b62;line-height:1.7}
.mid{font:800 24px monospace;direction:ltr;text-align:center;background:#e6f4ec;border:2px dashed #0f7a4d;border-radius:12px;padding:12px;margin:10px 0;user-select:all}
textarea{width:100%;height:110px;border:1px solid #ccd5ce;border-radius:10px;padding:10px;font:13px monospace;direction:ltr}
button{border:0;border-radius:10px;padding:11px 20px;font:700 16px inherit;cursor:pointer;background:#0f7a4d;color:#fff}button.g{background:#e6f4ec;color:#0f7a4d}
.err{background:#fff2f4;color:#c92a2a;border-radius:10px;padding:10px;margin:10px 0;display:none}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}</style></head>
<body><div class="c"><h1>🔐 تفعيل Scope</h1><p>البرنامج ده محتاج كود تفعيل من المالك علشان يشتغل على الجهاز ده. ابعت <b>رقم الجهاز</b> التالي للمالك، وهيبعتلك كود التفعيل:</p>
<div class="mid" id="mid">…</div><div class="row"><button class="g" id="cp">📋 نسخ رقم الجهاز</button></div>
<p style="margin-top:16px"><b>كود التفعيل</b></p><textarea id="lic_code" placeholder="الصق كود التفعيل هنا"></textarea><div class="err" id="err"></div>
<div class="row"><button id="go">تفعيل</button></div><p style="font-size:13px;margin-top:14px">الكود مربوط بالجهاز ده بس ومينفعش يتنقل لجهاز تاني.</p></div>
<script>
const $=s=>document.querySelector(s);const R={bad:'الكود غير صحيح',machine:'الكود ده لجهاز تاني — لازم يتعمل لرقم الجهاز اللي فوق',expired:'الكود منتهي',empty:'الصق الكود الأول',clock:'تاريخ الجهاز رجع لورا — صحّح التاريخ والوقت وأعد المحاولة'};
(async()=>{const s=await scopeDesktop.licStatus();$('#mid').textContent=s.mid;if(s.reason==='expired'){$('#err').style.display='block';$('#err').textContent='⚠ ترخيص الجهاز ده انتهى'+(s.exp?' بتاريخ '+s.exp:'')+' — بياناتك محفوظة ومتمسحتش. اطلب كود تجديد من المالك (نفس رقم الجهاز) والصقه تحت.'}if(s.reason==='clock'){$('#err').style.display='block';$('#err').textContent=R.clock}})();
$('#cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText($('#mid').textContent)};
$('#go').onclick=async()=>{const c=$('#lic_code').value.trim();if(!c){$('#err').style.display='block';$('#err').textContent=R.empty;return}const r=await scopeDesktop.activate(c);if(!r.ok){$('#err').style.display='block';$('#err').textContent=R[r.reason]||R.bad}};
</script></body></html>

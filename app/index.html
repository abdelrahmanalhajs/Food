<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOODPILOT AI | نظام المطعم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#17231c;--mute:#5d6b62;--line:#e1e6df;--brand:#0f7a4d;--soft:#e6f4ec;--bad:#c92a2a;--warn:#e8890c;--ok:#0f7a4d;--side:#10241a}
@media(prefers-color-scheme:dark){:root{--bg:#0e1411;--card:#18211c;--ink:#e8efe9;--mute:#9bab9f;--line:#2a372f;--brand:#3ccf8e;--soft:#1b2d24;--bad:#ff6b6b;--warn:#ffb04a;--ok:#3ccf8e;--side:#0a120e}}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);color:#dfeee5;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:18px;margin:4px 8px 2px;color:#3ccf8e}aside small{display:block;margin:0 8px 12px;color:#8fa699}
aside button{display:flex;width:100%;gap:8px;align-items:center;background:none;border:0;color:inherit;font:inherit;padding:9px 12px;border-radius:10px;cursor:pointer;text-align:start}
aside button:hover{background:#1c3a2b}aside button.on{background:#0f7a4d;color:#fff}
aside .bd{margin-inline-start:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
main{padding:20px;max-width:1150px;width:100%;min-width:0}
h2{margin:0 0 4px;font-size:24px}.sub{color:var(--mute);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;overflow-x:auto}
.grid .card{margin:0}
.k{font-size:13px;color:var(--mute)}.v{font-size:24px;font-weight:800}.v.s{font-size:18px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.wr{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--brand);background:var(--soft);white-space:nowrap}.tw{overflow-x:auto}
input,select,textarea{font:inherit;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
input[type=number]{width:100px}
button.b{font:inherit;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:700}
button.b.g{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}button.b.r{background:var(--bad)}button.b.sm{padding:3px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:10px}.row label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid currentColor}
.al{border-inline-start:4px solid var(--warn);padding:8px 12px;background:var(--card);border-radius:10px;margin-bottom:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.al.c{border-inline-start-color:var(--bad)}.al.i{border-inline-start-color:var(--brand)}
.score{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;font-size:36px;font-weight:800;margin:auto}
.chat{background:var(--soft);padding:10px 14px;border-radius:12px;margin:8px 0}.chat.u{background:var(--brand);color:#fff;margin-inline-start:30%}
.note{font-size:12px;color:var(--mute)}

.click{cursor:pointer}.click:hover{border-color:var(--brand);box-shadow:0 2px 10px #0002}
.mdl{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}.mdl[hidden]{display:none}
.mbox{background:var(--card);color:var(--ink);border-radius:14px;max-width:920px;width:100%;max-height:88vh;overflow:auto;padding:16px}
.seg{transition:stroke-dasharray 1.2s ease}.donut{animation:spin 1.2s ease}@keyframes spin{from{transform:rotate(-140deg);opacity:0}to{transform:rotate(0);opacity:1}}
button.b.g.on{background:var(--brand);color:#fff}
@media(max-width:800px){.app{grid-template-columns:minmax(0,1fr)}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}main{padding:12px}aside{position:static;height:auto;display:flex;overflow-x:auto;white-space:nowrap}aside h1,aside small{display:none}aside button{width:auto}}
</style></head>
<body><div class="app">
<aside id="nav"></aside>
<main id="main"></main>
</div>
<div id="modal" class="mdl" hidden><div class="mbox"><button class="b g sm" data-act="closeModal">✕ إغلاق</button><div id="mbody"></div></div></div>
<script>
const KEY='foodpilot_app_v4';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=(x,d=0)=>(+x||0).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d});
const M=x=>N(x)+' ج.م';
const P=x=>N(x,1)+'%';
const iso=d=>d.toISOString().slice(0,10);
const today=()=>iso(new Date());
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const uid=()=>Math.random().toString(36).slice(2,9);
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const daysAhead=n=>addDays(today(),n);
const UNITS={g:[['كجم',1000],['جم',1]],ml:[['لتر',1000],['مل',1]],pc:[['قطعة',1],['كرتونة (12)',12]]};
const UL={g:'جم',ml:'مل',pc:'قطعة'};

// ---------- seed ----------
function seed(){
 const ing=[
  ['chicken','صدور فراخ','g',0.18,85,50000,12000,'مورد A'],['pasta','مكرونة','g',0.03,100,60000,15000,'مورد B'],
  ['cream','كريمة','ml',0.08,100,12000,5000,'مورد A'],['mozz','موزاريلا','g',0.30,100,3500,6000,'مورد B'],
  ['butter','زبدة','g',0.25,100,4000,1500,'مورد C'],['spice','توابل','g',0.20,100,2500,500,'مورد C'],
  ['box','عبوة','pc',5,100,300,100,'مورد C'],['patty','برجر لحم','g',0.25,80,40000,10000,'مورد A'],
  ['bun','خبز برجر','pc',3,100,400,100,'مورد B'],['cheddar','شيدر','g',0.28,100,6000,2000,'مورد B'],
  ['lettuce','خس','g',0.04,90,5000,1500,'مورد C'],['tomato','طماطم','g',0.03,92,9000,3000,'مورد C'],
  ['dough','عجينة بيتزا','g',0.02,100,40000,10000,'مورد B'],['sauce','صوص طماطم','g',0.04,100,12000,4000,'مورد B'],
  ['fries','بطاطس','g',0.03,100,50000,10000,'مورد C']
 ].map(r=>({id:r[0],name:r[1],unit:r[2],cost:r[3],yield:r[4],stock:r[5],min:r[6],supplier:r[7],last:r[3]}));
 const rec=[
  ['r1','تشيكن ألفريدو','باستا',[['pasta',230],['chicken',120],['cream',100],['mozz',30],['butter',15],['spice',5],['box',1]],{dine:150,direct:160,app:195}],
  ['r2','تشيكن بيستو','باستا',[['pasta',230],['chicken',120],['cream',60],['butter',15],['spice',5],['box',1]],{dine:120,direct:125,app:150}],
  ['r3','بيتزا مارجريتا','بيتزا',[['dough',250],['sauce',80],['mozz',120],['box',1]],{dine:110,direct:120,app:150}],
  ['r4','برجر لحم','برجر',[['patty',150],['bun',1],['cheddar',30],['lettuce',20],['tomato',30],['box',1]],{dine:120,direct:130,app:165}],
  ['r5','بطاطس مقلية','جانبي',[['fries',200],['box',1]],{dine:40,direct:45,app:60}]
 ].map(r=>({id:r[0],name:r[1],cat:r[2],items:r[3].map(i=>({ing:i[0],qty:i[1]})),prices:r[4],prep:{r1:8,r2:8,r3:10,r4:6,r5:3}[r[0]]}));
 let seedN=7;const rnd=()=>{seedN=(seedN*9301+49297)%233280;return seedN/233280};
 const w={r1:1.0,r2:.3,r3:.7,r4:.9,r5:1.2};const ch={dine:.4,direct:.15,app:.45};
 const brs=[['b1','الفرع الرئيسي — المعادي',1],['b2','فرع مدينة نصر',.7],['b3','فرع التجمع',.3]];
 const sales=[];
 for(let d=29;d>=0;d--){for(const [bid,,bm] of brs){for(const c of Object.keys(ch)){const items=[];
   for(const r of rec){const q=Math.round(w[r.id]*ch[c]*31*bm*(0.6+rnd()*0.8));if(q>0)items.push({rid:r.id,qty:q,price:r.prices[c]})}
   const un=items.reduce((a,i)=>a+i.qty,0),od=Math.round(un/2.2),cc=Math.round(od*(0.02+rnd()*0.03)),av=un?items.reduce((a,i)=>a+i.qty*i.price,0)/un*2.2:0;sales.push({id:uid(),date:daysAgo(d),ch:c,items,disc:c==='app'?5:(rnd()<.07?15:0),seeded:true,br:bid,canc:cc,cancVal:Math.round(cc*av)})}}}
 const exp=[['إيجار','fixed',40000,25,'b1'],['إيجار','fixed',30000,25,'b2'],['إيجار','fixed',22000,25,'b3'],['كهرباء ومياه وغاز','fixed',9000,20,'b1'],['كهرباء ومياه وغاز','fixed',6500,20,'b2'],['كهرباء ومياه وغاز','fixed',4500,20,'b3'],['صيانة','variable',2500,10,'b1'],['صيانة','variable',1500,10,'b2'],['تسويق وإعلانات','variable',15000,15,''],['مصاريف إدارية','fixed',8000,25,'']]
  .map(e=>({id:uid(),cat:e[0],type:e[1],amount:e[2],date:daysAgo(e[3]),note:'',br:e[4]}));
 const emp=[['أحمد سالم','مدير فرع','b1',18000],['محمود علي','شيف','b1',15000],['كريم حسن','طباخ','b1',9000],['يوسف عادل','طباخ','b1',9000],['سارة محمد','كاشير','b1',7000],['هشام فتحي','مدير فرع','b2',15000],['ياسر نبيل','شيف','b2',12000],['عمر خالد','طباخ','b2',8000],['منى سعيد','كاشير','b2',6500],['طارق جمال','مدير فرع','b3',12000],['إسلام رشاد','طباخ','b3',8000],['هدى عاطف','كاشير','b3',6000],['المدير العام','إدارة','',20000]]
  .map((e,i)=>({id:'e'+i,name:e[0],role:e[1],br:e[2],base:e[3],allow:Math.round(e[3]*.1),inc:0,otH:0,abs:0,adv:0}));
 const use={};for(const s of sales)for(const it of s.items){const r=rec.find(x=>x.id===it.rid);for(const ri of r.items)use[ri.ing]=(use[ri.ing]||0)+it.qty*ri.qty}
 const cover={chicken:9,pasta:12,cream:8,mozz:2.5,butter:14,spice:30,box:10,patty:11,bun:9,cheddar:12,lettuce:6,tomato:7,dough:10,sauce:12,fries:9};
 ing.forEach(g=>{const dq=(use[g.id]||0)*100/g.yield/30;g.stock=Math.round(dq*(cover[g.id]||10));g.min=Math.round(dq*4)});
 const sup=[{name:'مورد A',rating:4.5,terms:15},{name:'مورد B',rating:4,terms:7},{name:'مورد C',rating:3.5,terms:0}];
 const quotes={};for(const g of ing){quotes[g.id]=sup.map(s=>{const pr=g.supplier===s.name?g.cost:g.cost*(0.9+rnd()*0.25);return {sup:s.name,price:+pr.toFixed(4),prev:+(pr*(0.94+rnd()*0.12)).toFixed(4)}})}
 const inv=[['مورد A',5,[['chicken',30000,3600],['cream',10000,800]]],['مورد B',10,[['mozz',20000,6000],['pasta',40000,1200]]],['مورد C',2,[['tomato',30000,900],['spice',5000,1000]]],['مورد A',3,[['patty',40000,10000]]]]
  .map(v=>{const tm=sup.find(s=>s.name===v[0]).terms,dt=daysAgo(v[1]);return {id:uid(),supplier:v[0],date:dt,lines:v[2].map(l=>({ing:l[0],qty:l[1],unit:1,total:l[2]})),status:'approved',paid:false,dueDate:addDays(dt,tm),dup:false}});
 const waste=[['b1',22,'chicken',1800,'تجهيز زائد'],['b1',12,'lettuce',2500,'انتهاء صلاحية'],['b1',5,'mozz',700,'سقوط'],['b2',18,'patty',3000,'خطأ تحضير'],['b2',9,'tomato',3000,'تلف'],['b3',20,'chicken',4000,'تلف تخزين'],['b3',14,'mozz',2500,'انتهاء صلاحية'],['b3',6,'cream',3000,'انتهاء صلاحية'],['b3',3,'patty',2000,'خطأ تحضير']]
  .map(w=>({id:uid(),date:daysAgo(w[1]),br:w[0],ing:w[2],qty:w[3],reason:w[4]}));
 return {branches:brs.map(b=>({id:b[0],name:b[1]})),emp,ing,rec,sales,exp,inv,counts:[],plog:[],sup,quotes,waste,
  cash:{cash:85000,bank:240000},draw:[{id:uid(),date:daysAgo(20),amount:20000,src:'cash',note:'مسحوبات المالك'},{id:uid(),date:daysAgo(8),amount:15000,src:'bank',note:'مسحوبات شخصية'}],
  outside:[{id:uid(),name:'تأمين إيجار فرع التجمع',amount:30000},{id:uid(),name:'سلفة لدى مورد',amount:5000}],
  channels:{dine:{name:'داخل المطعم',comm:0,del:0},direct:{name:'طلب مباشر',comm:0,del:12},app:{name:'تطبيق توصيل',comm:30,del:0}},
  target:30,settings:{period:30,br:'all',ins:0,fcLimit:33,minMargin:15,settleDays:7,payDay:28,rentDay:1,hours:12,commOk:25,discMax:5,capacity:15,workDays:26,shiftHours:8,lead:2,targetSales:900000,targetNet:120000}};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.ing||!S.branches||!S.cash)S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const ING=id=>S.ing.find(i=>i.id===id);
const REC=id=>S.rec.find(r=>r.id===id);
const brN=id=>id?((S.branches.find(b=>b.id===id)||{}).name||'-'):'مشترك (المركز)';
const brName=()=>(S.settings.br&&S.settings.br!=='all')?brN(S.settings.br):'كل الفروع';
function empParts(e){const day=e.base/30,ot=e.otH*(day/8)*1.5,ab=e.abs*day,gross=e.base+e.allow+e.inc+ot-ab,ins=e.base*(+S.settings.ins||0)/100;return {ot,ab,gross,ins,net:gross-e.adv,cost:gross+ins}}
const empCost=e=>empParts(e).cost;
function payRows(){return S.emp.map(e=>({id:'p'+e.id,cat:'مرتبات',type:'fixed',amount:empCost(e)*S.settings.period/30,ind:true,br:e.br,note:e.name,date:today()}))}
function allEx(){return S.exp.filter(e=>inPeriod(e.date)).concat(payRows())}

// ---------- engine ----------
const unitCost=i=>i.cost/(i.yield/100);            // cost per usable base unit
function recCost(r){let food=0,pack=0;for(const it of r.items){const g=ING(it.ing);if(!g)continue;const c=it.qty*unitCost(g);if(g.name==='عبوة'||g.cat==='pack')pack+=c;else food+=c}return {food,pack,total:food+pack}}
function chanNet(price,c,disc=0){const ch=S.channels[c];const p=price*(1-disc/100);return p-p*ch.comm/100}
function inPeriod(d){return d>=daysAgo(S.settings.period-1)&&d<=today()}
function saleCalc(s){let gross=0,cogs=0,units=0;for(const it of s.items){const r=REC(it.rid);if(!r)continue;gross+=it.qty*it.price*(1-s.disc/100);cogs+=it.qty*(it.cost??recCost(r).total);units+=it.qty}
 const ch=S.channels[s.ch];const comm=gross*ch.comm/100;const del=ch.del*(s.orders||units/2.2);
 return {gross,cogs,comm,del,units}}
function agg(br=S.settings.br||'all'){const sales=S.sales.filter(s=>inPeriod(s.date)&&(br==='all'||s.br===br));let R={rev:0,cogs:0,comm:0,del:0,units:0,orders:0,canc:0,cancVal:0,ingUse:{},byCh:{},byRec:{},daily:{}};
 R.ingQty={};for(const k in S.channels)R.byCh[k]={rev:0,cogs:0,comm:0,del:0,ord:0};
 for(const s of sales){const c=saleCalc(s);const ord=s.orders!==undefined?s.orders:Math.round(c.units/2.2);R.orders+=ord;R.canc+=s.canc||0;R.cancVal+=s.cancVal||0;const dper=s.orders?S.channels[s.ch].del*s.orders/c.units:S.channels[s.ch].del/2.2;R.rev+=c.gross;R.cogs+=c.cogs;R.comm+=c.comm;R.del+=c.del;R.units+=c.units;
  const b=R.byCh[s.ch];b.ord+=ord;b.rev+=c.gross;b.cogs+=c.cogs;b.comm+=c.comm;b.del+=c.del;
  R.daily[s.date]=(R.daily[s.date]||0)+c.gross;
  for(const it of s.items){const r=REC(it.rid);if(!r)continue;for(const ri of r.items){const g=ING(ri.ing);if(g){R.ingUse[g.id]=(R.ingUse[g.id]||0)+it.qty*ri.qty*unitCost(g);R.ingQty[g.id]=(R.ingQty[g.id]||0)+it.qty*ri.qty/(g.yield/100)}}const x=R.byRec[it.rid]||(R.byRec[it.rid]={qty:0,rev:0,cm:0,cogs:0,sc:0,time:0});const g=it.qty*it.price*(1-s.disc/100);const cost=it.qty*(it.cost??recCost(r).total);const cm=g-g*S.channels[s.ch].comm/100-cost-dper*it.qty;x.qty+=it.qty;x.rev+=g;x.cm+=cm;x.cogs+=cost;x.time+=it.qty*(r.prep??5);x.sc+=g*S.channels[s.ch].comm/100+dper*it.qty}}
 const totRev=br==='all'?R.rev:S.sales.filter(s=>inPeriod(s.date)).reduce((a,s)=>a+saleCalc(s).gross,0);const share=br==='all'?1:(totRev?R.rev/totRev:0);R.share=share;
 const ex=allEx().filter(e=>br==='all'||e.br===br||!e.br).map(e=>(br!=='all'&&!e.br)?{...e,amount:e.amount*share}:e);
 R.byCat={};ex.forEach(e=>R.byCat[e.cat]=(R.byCat[e.cat]||0)+e.amount);R.fixed=ex.filter(e=>e.type==='fixed').reduce((a,e)=>a+e.amount,0);R.varx=ex.filter(e=>e.type!=='fixed').reduce((a,e)=>a+e.amount,0);
 R.gp=R.rev-R.cogs;R.cm=R.rev-R.cogs-R.comm-R.del-R.varx;R.shrinkCnt=S.counts.filter(c=>inPeriod(c.date)&&c.val<0).reduce((a,c)=>a-c.val,0)*share;R.waste=S.waste.filter(w=>inPeriod(w.date)&&(br==='all'||w.br===br)).reduce((a,w)=>a+w.qty*(ING(w.ing)?.cost||0),0);R.shrink=R.shrinkCnt+R.waste;R.net=R.cm-R.fixed-R.shrink;R.cmr=R.rev?R.cm/R.rev:0;R.be=R.cmr>0?(R.fixed+R.shrink)/R.cmr:NaN;
 R.avgTicket=R.orders?R.rev/R.orders:0;R.fcp=R.rev?R.cogs/R.rev*100:0;R.commp=R.rev?R.comm/R.rev*100:0;R.sal=ex.filter(e=>e.cat==='مرتبات').reduce((a,e)=>a+e.amount,0);R.labp=R.rev?R.sal/R.rev*100:0;
 R.ovh=ex.filter(e=>e.ind!==false).reduce((a,e)=>a+e.amount,0);R.ovhp=R.rev?R.ovh/R.rev*100:0;
  const pools={};ex.filter(e=>e.ind!==false).forEach(e=>pools[e.cat]=(pools[e.cat]||0)+e.amount);R.pools=pools;R.unalloc=ex.filter(e=>e.ind===false).reduce((a,e)=>a+e.amount,0);
 const rs=Object.values(R.byRec);const dv=(x,d)=>d==='units'?x.qty:d==='cost'?x.cogs:d==='time'?x.time:x.rev;
 for(const x of rs){x.ovh=0;x.by={}}
 for(const cat in pools){const d=drvOf(cat);const tot=rs.reduce((a,x)=>a+dv(x,d),0);for(const x of rs){const v=tot?pools[cat]*dv(x,d)/tot:0;x.by[cat]=v;x.ovh+=v}}
 for(const x of rs){x.ovhU=x.qty?x.ovh/x.qty:0;x.full=x.cm-x.ovh}
 R.ovhAvg=R.units?R.ovh/R.units:0;R.scAvg=R.units?(R.comm+R.del)/R.units:0;
 return R}
const scU=(R,id)=>{const x=R.byRec[id];return x&&x.qty?x.sc/x.qty:R.scAvg};

 const box=(t,l,c)=>`<div class="card" style="margin:0"><div class="k" style="margin-bottom:6px;color:${c};font-weight:700">${t}</div>${l}</div>`;
 const byF=rows.slice().sort((a,b)=>b.full-a.full),byM=rows.slice().sort((a,b)=>mg(b)-mg(a)),byQ=rows.slice().sort((a,b)=>b.qty-a.qty),byC=rows.slice().sort((a,b)=>b.cogs/b.qty-a.cogs/a.qty);
 let par='';for(const a of byQ)for(const b of byF){if(b.qty<a.qty&&b.full>a.full&&(!par||b.full-a.full>par.d))par={d:b.full-a.full,a,b}}
 return `<div class="card"><h3 style="margin-top:0">🏆 المنتجات اللي بتكسبك فعلاً (Product Profit Ranking)</h3>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">${box('💰 أعلى إجمالي ربح',lst(byF,x=>M(x.full)),'var(--ok)')}${box('📈 أعلى هامش ربح',lst(byM,x=>P(mg(x))),'var(--ok)')}${box('🔥 أعلى مبيعات',lst(byQ,x=>N(x.qty)+' وحدة'),'var(--brand)')}${box('📉 أقل ربحية',lst(byF.slice().reverse(),x=>M(x.full)+' · '+P(mg(x))),'var(--bad)')}${box('🏭 أعلى تكلفة تصنيع',lst(byC,x=>N(x.cogs/x.qty,1)+' ج.م ('+P(x.rev?x.cogs/x.rev*100:0)+')'),'var(--warn)')}</div>
 ${par?`<div class="al w" style="margin-top:10px">💡 <b>${esc(par.a.r.name)}</b> باع ${N(par.a.qty)} وحدة وربحه ${M(par.a.full)}، بينما <b>${esc(par.b.r.name)}</b> باع ${N(par.b.qty)} فقط وربحه ${M(par.b.full)} — الأكثر مبيعًا مش دايمًا الأكثر ربحًا.</div>`:''}</div>`}
function secOpp(R){const rows=S.rec.map(r=>({r,...(R.byRec[r.id]||{})})).filter(x=>x.qty),nm=R.rev?R.net/R.rev:0;
 const opp=rows.map(x=>({...x,dp:.1*x.cm,nm2:(R.net+.1*x.cm)/(R.rev+.1*x.rev),up:x.cm/x.rev>nm})).sort((a,b)=>b.dp-a.dp);
 return `<div class="card"><h3 style="margin-top:0">💡 هل زيادة مبيعات صنف تحسّن الهامش؟</h3><div class="note">المصروفات الثابتة لا تزيد مع الطلبات الإضافية. الصنف الذي هامش مساهمته أعلى من هامش المطعم الصافي (${P(nm*100)}) يرفع الهامش العام كلما زادت مبيعاته (افتراض زيادة 10% في الصنف فقط).</div>
 ${tbl(['الصنف','هامش مساهمته','ربح إضافي عند +10%','هامش المطعم بعد الزيادة','الأثر'],opp.map(x=>[`<b>${esc(x.r.name)}</b>`,P(x.cm/x.rev*100),`<span class="pos">+${M(x.dp)}</span>`,P(x.nm2*100),`<span class="${x.up?'pos':'wr'}">${x.up?'↑ يرفع الهامش':'↓ يزيد الربح لكن يخفض النسبة'}</span>`]))}</div>`}
function secChannels(R){const rows=Object.keys(S.channels).map(k=>{const b=R.byCh[k],cm=b.rev-b.cogs-b.comm-b.del;return {k,b,cm,pc:b.rev?cm/b.rev*100:0,po:b.ord?cm/b.ord:0}});
 const best=rows.slice().sort((a,b)=>b.pc-a.pc)[0],worst=rows.slice().sort((a,b)=>a.pc-b.pc)[0];
 return `<div class="card"><h3 style="margin-top:0">🧭 أين تبيع أفضل؟ (Sales Channel Intelligence)</h3>
 ${tbl(['القناة','المبيعات','الحصة','الطلبات','متوسط الفاتورة','العمولة','خامات+توصيل','صافي المساهمة','% مساهمة','مساهمة/طلب','الحكم'],rows.map(r=>[`<b>${S.channels[r.k].name}</b>`,M(r.b.rev),P(R.rev?r.b.rev/R.rev*100:0),N(r.b.ord),M(r.b.ord?r.b.rev/r.b.ord:0),M(r.b.comm),M(r.b.cogs+r.b.del),`<b class="${r.cm<0?'neg':'pos'}">${M(r.cm)}</b>`,P(r.pc),M(r.po),r.k===best.k?'🏆 ركّز عليها':r.k===worst.k&&rows.length>1?'⚠ راجعها':'مقبولة']))}
 <div class="note">الأفضل: <b>${S.channels[best.k].name}</b> (${P(best.pc)} مساهمة)${rows.length>1?` · الأضعف: <b>${S.channels[worst.k].name}</b> (${P(worst.pc)}).`:''} المساهمة بعد الخامات والعمولة والتوصيل وقبل المصروفات الثابتة.</div></div>`}
function secBranches(){if((S.settings.br||'all')!=='all')return '';const k=K(),rows=S.branches.map(b=>({b,R:agg(b.id)})).filter(x=>x.R.rev);if(rows.length<2)return '';

function secSupMini(){const I=supInfo(),top=I.rows.filter(r=>r.sv>0).sort((a,b)=>b.sv-a.sv).slice(0,4);return `<div class="card"><h3 style="margin-top:0">🤝 ذكاء الموردين</h3><div class="al ${I.save>0?'w':'i'}">لو اشتريت كل خامة من المورد الأرخص توفر <b>${M(I.save)}</b> شهريًا.</div>${tbl(['الخامة','المورد الحالي','الأرخص','فرق السعر','توفير شهري'],top.map(r=>[esc(r.g.name),esc(r.g.supplier)+' '+N(r.g.cost,3),esc(r.best.sup)+' '+N(r.best.price,3),P((r.g.cost-r.best.price)/r.g.cost*100),`<b class="pos">${M(r.sv)}</b>`]))}</div>`}

 ${tbl(['السيناريو','نمو المبيعات/شهر','بعد 3 شهور','بعد 6 شهور','بعد سنة','الكاش'],F.map(s=>[`<b>${s.n}</b>`,`<span dir="ltr">${(s.gm>=0?'+':'')+N(s.gm*100,1)}%</span>`,...[3,6,12].map(m=>`<span class="${s.rows[m].net<0?'neg':'pos'}">${M(s.rows[m].net)}</span><div class="note">كاش ${M(s.rows[m].cash)}</div>`),s.out?`<span class="neg">ينفد في الشهر ${s.out}</span>`:'<span class="pos">لا ينفد</span>']))}</div>`}

 <div class="card" style="border-top:4px solid ${M0.sit[2]}"><h3 style="margin-top:0">${M0.sit[0]} ${M0.sit[1]}</h3>
 <div class="grid">${stat('صافي الربح الشهري الحالي',M(M0.netM),M0.netM<0?'neg':'pos')}${stat('هدف صافي الربح',M(M0.tgN))}${stat('أثر الخطة المُقدَّر (بعد خصم 50% للتحفظ والتداخل)','+'+M(M0.total),'pos')}${stat('الربح المتوقع بعد الخطة',M(M0.after),M0.after<0?'neg':'pos')}</div>
 <div class="al ${M0.after<0?'c':'i'}" style="margin-top:8px">${M0.loss?(M0.beAt?`✓ تنفيذ الخطة حتى «${M0.beAt[0]}» يعيدك للتعادل (ربح صفر)${M0.tgAt?'، وحتى «'+M0.tgAt[0]+'» يحقق هدفك':'، ويحتاج الوصول للهدف خطوات إضافية'}.`:'⚠ الخطة الحالية لا تكفي وحدها للتعادل؛ تحتاج قرارات أكبر: إيجار، عدد الفروع، أو نموذج التشغيل (انظر أسفل).'):(M0.tgAt?`✓ تحقق الهدف عند إتمام «${M0.tgAt[0]}».`:M0.netM>=M0.tgN?'✓ حققت الهدف؛ ركّز على الحفاظ وزيادة الربح.':'الخطة تقرّبك من الهدف لكنها لا تبلغه كاملًا؛ ارفع الأسعار أو خفّض الثابتة أكثر.')}</div>
 <div class="note">تم إنجاز ${M0.done} من ${M0.n} خطوة، أثر محقق ${M(M0.doneImp)} شهريًا.</div></div>
 ${M0.PH.map(([n,l],i)=>l.length?`<div class="card"><h3 style="margin-top:0">${n}</h3><div class="tw"><table><tr><th>تم</th><th>الإجراء</th><th>لماذا</th><th>الأثر الشهري</th><th>التراكمي</th><th></th></tr>${l.map(a=>`<tr><td><input type="checkbox" data-pd="${a.id}" ${(S.planDone||{})[a.id]?'checked':''}></td><td><b>${esc(a.t)}</b></td><td class="note">${esc(a.why)}</td><td class="pos">${a.eff>0?'+'+M(a.eff):'—'}</td><td>${M(M0.netM+a.cum)}</td><td><button class="b g sm" data-act="planGo" data-t="${a.go}">افتح</button></td></tr>`).join('')}</table></div></div>`:'').join('')}
 ${M0.cash.length&&(M0.loss||M0.C.after<0||M0.C.o7>M0.C.liquid)?`<div class="card" style="border-top:4px solid var(--warn)"><h3 style="margin-top:0">🛡 حماية السيولة أثناء التنفيذ</h3>${tbl(['الإجراء','الرقم','أثر على الكاش'],M0.cash.map(c=>[`<b>${c[0]}</b>`,c[1],`<span class="pos">+${M(c[2])}</span>`]))}</div>`:''}
 ${M0.loss||M0.after<0?`<div class="card" style="border-top:4px solid var(--bad)"><h3 style="margin-top:0">لو الخطة لم تكفِ: قرارات أكبر</h3><ul style="line-height:2;margin:0"><li>إعادة التفاوض على الإيجار أو الانتقال لموقع أرخص (جرّب المحاكي بإيجار أقل).</li><li>إغلاق أو دمج الفرع الأضعف إن لم يحقق التعادل بعد 60 يومًا من الخطة.</li><li>تقليص المنيو للأصناف الأعلى مساهمة وتقليل الهالك.</li><li>تحويل أكبر حصة ممكنة من طلبات التطبيقات للمباشر.</li></ul></div>`:''}
 ${secScore(R)}
 <div class="note">الأثر تقدير مبني على بياناتك وافتراضات بسيطة، مع خصم 50% للتحفظ والتداخل بين الإجراءات. نفّذ على مراحل وراجع الأرقام بعد كل أسبوع.</div>`};

// ---- cash
V.cash=()=>{const C=cashPos(),R=agg('all'),dr=drawInfo(R),F=msForecast(R);const rsv=.1*R.rev,left=R.net-dr.d;
 return `<h2>💵 الخزنة والسيولة (Cash Position)</h2><p class="sub">المطعم ممكن يكون رابح محاسبيًا لكن يعاني من نقص سيولة. هنا ترى الكاش الفعلي والفلوس بره والتزاماتك.</p>
 <div class="grid">${kpi('الكاش',M(C.cash),'s')}${kpi('البنك',M(C.bank),'s')}${kpi('إجمالي السيولة',M(C.liquid))}${kpi('فلوس بره',M(C.outside),'s','تطبيقات '+M(C.rec)+' · سلف '+M(C.adv)+' · أخرى '+M(C.outs))}${kpi('مستحق للموردين',M(C.pay),'s')}${kpi('التزامات 7 أيام',M(C.o7),C.o7>C.liquid?'neg':'s')}${kpi('التزامات 30 يومًا',M(C.o30),'s','موردون+مرتبات+إيجار+مصروفات')}${kpi('الصافي بعد الالتزامات',M(C.after),C.after<0?'neg':'pos')}</div>
 <div class="card" style="border-top:4px solid ${C.after<0?'var(--bad)':'var(--ok)'}"><h3 style="margin-top:0">هل السيولة تكفي الشهر القادم؟</h3>
 <div class="al ${C.after<0?'c':'i'}">${C.after<0?`⚠ لا تكفي: الكاش والبنك والمستحقات ${M(C.liquid+C.outside)} مقابل التزامات 30 يومًا ${M(C.o30)} — عجز ${M(-C.after)} لن يُغطّى إلا بمبيعات الشهر.`:`✓ تكفي: السيولة والمستحقات ${M(C.liquid+C.outside)} تغطي التزامات 30 يومًا ${M(C.o30)} بفائض ${M(C.after)}.`}</div>
 <div class="note">الكاش والبنك وحدهما يغطيان ${isFinite(C.coverDays)?N(C.coverDays):'-'} يومًا من المرتبات والإيجار والمصروفات الثابتة (بدون أي مبيعات جديدة). صافي الربح المتوقع هذا الشهر ${M(F.net)}.</div></div>
 <div class="card"><h3 style="margin-top:0">تحديث الأرصدة</h3><div class="row"><label>الكاش بالخزنة<input type="number" id="cc" value="${S.cash.cash}"></label><label>الرصيد بالبنك<input type="number" id="cb" value="${S.cash.bank}"></label><button class="b" data-act="saveCash">تحديث</button></div><div class="note">مبيعات الصالة والمباشر تُضاف للكاش تلقائيًا عند تسجيلها، والمصروفات والمسحوبات وسداد الموردين تُخصم من المصدر المختار.</div></div>
 <div class="card"><h3 style="margin-top:0">🟠 مستحقات عند تطبيقات التوصيل (${M(C.rec)})</h3>${tbl(['تاريخ البيع','الفرع','صافي بعد العمولة','موعد التحصيل المتوقع'],C.recRows.slice(-12).reverse().map(r=>[r.date,esc(brN(r.br)),M(r.amt),r.due]))}<div class="note">مبيعات التطبيقات خلال آخر ${S.settings.settleDays||7} أيام (فترة التسوية) بعد العمولة.</div></div>
 <div class="card"><h3 style="margin-top:0">🔵 فلوس بره أخرى</h3>${tbl(['البند','المبلغ',''],[['سلف الموظفين (من الرواتب)',M(C.adv),''],...S.outside.map(o=>[esc(o.name),M(o.amount),`<button class="b r sm" data-act="delOut" data-id="${o.id}">×</button>`])])}<div class="row"><label>البند<input id="on"></label><label>المبلغ<input type="number" id="oa"></label><button class="b g" data-act="addOut">إضافة</button></div></div>
 <div class="card"><h3 style="margin-top:0">🔴 مستحقات الموردين (${M(C.pay)})</h3>${C.unpaid.length?`<div class="tw"><table><tr><th>المورد</th><th>تاريخ الفاتورة</th><th>الاستحقاق</th><th>المبلغ</th><th>الحالة</th><th></th></tr>${C.unpaid.sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).map(v=>`<tr><td>${esc(v.supplier)}</td><td>${v.date}</td><td>${v.dueDate}</td><td>${M(invTotal(v))}</td><td class="${v.dueDate<today()?'neg':v.dueDate<=daysAhead(7)?'wr':''}">${v.dueDate<today()?'متأخر':v.dueDate<=daysAhead(7)?'خلال 7 أيام':'لاحقًا'}</td><td><select data-ps="${v.id}"><option value="cash">من الكاش</option><option value="bank">من البنك</option></select> <button class="b sm" data-act="payInv" data-id="${v.id}">تسديد</button></td></tr>`).join('')}</table></div>`:'<div class="note">لا توجد مستحقات</div>'}<div class="note">الفواتير المعتمدة من صفحة الفواتير تتحول لمستحقات تلقائيًا حسب شروط دفع المورد.</div></div>
 <div class="card"><h3 style="margin-top:0">📅 التزامات الـ7 أيام القادمة (${M(C.o7)})</h3>${tbl(['البند','التاريخ','المبلغ'],C.obl7.map(o=>[esc(o.n),o.d,M(o.a)]))}<div class="note">${C.o7>C.liquid?'⚠ أكبر من السيولة المتاحة.':'السيولة الحالية تغطيها.'}</div></div>
 <div class="card"><h3 style="margin-top:0">🏧 المسحوبات وتأثيرها على المطعم</h3>
 <div class="grid">${kpi('مسحوبات الفترة',M(dr.d),dr.d>R.net?'neg':'s')}${kpi('من صافي الربح',P(dr.pct),dr.pct>70?'neg':'s')}${kpi('الربح بعد المسحوبات',M(left),left<0?'neg':'pos')}${kpi('احتياطي مستهدف 10% من المبيعات',M(rsv),left>=rsv?'pos':'wr',left>=rsv?'متحقق':'غير متحقق')}</div>
 <div class="al ${dr.d>R.net?'c':dr.pct>70?'':'i'}">${dr.d>R.net?'⚠ المسحوبات أكبر من صافي الربح: تُستهلك من رأس مال المطعم وتضعف السيولة.':dr.pct>70?'المسحوبات تأكل أغلب الربح ولا يتبقى للاحتياطي والتطوير.':'المسحوبات ضمن حدود آمنة، ويتبقى ربح للاحتياطي والتطوير.'}</div>
 <div class="note">المسحوبات ليست مصروف تشغيل فلا تدخل في تكلفة الأصناف ولا نقطة التعادل، لكنها تُخصم من الكاش وتقلل الربح المتبقي في المطعم.</div>
 <div class="row"><label>التاريخ<input type="date" id="dd" value="${today()}"></label><label>المبلغ<input type="number" id="da"></label><label>من<select id="ds"><option value="cash">الكاش</option><option value="bank">البنك</option></select></label><label>ملاحظة<input id="dn"></label><button class="b" data-act="addDraw">تسجيل مسحوبات</button></div>
 ${tbl(['التاريخ','المبلغ','المصدر','ملاحظة',''],S.draw.slice().reverse().map(x=>[x.date,M(x.amount),x.src==='cash'?'كاش':'بنك',esc(x.note),`<button class="b r sm" data-act="delDraw" data-id="${x.id}">×</button>`]))}</div>
 <div class="card"><h3 style="margin-top:0">الربح المحاسبي مقابل السيولة</h3><div class="note">صافي الربح المحاسبي ${M(R.net)} لكن منه ${M(C.rec)} لم يتحصل بعد من التطبيقات، و${M(C.pay)} مستحقة للموردين لم تُسدد، و${M(dr.d)} خرجت مسحوبات. لذلك قد يظهر ربح بينما الكاش أقل.</div></div>`};

// ---- suppliers
V.sup=()=>{const I=supInfo();const best=Object.entries(I.sc).sort((a,b)=>b[1].value-a[1].value)[0];
 return `<h2>🤝 ذكاء الموردين (Supplier Intelligence)</h2><p class="sub">قارن الأسعار، اكتشف الارتفاعات، واعرف كام توفر لو اشتريت من الأفضل.</p>
 <div class="grid">${kpi('توفير شهري محتمل',M(I.save),I.save>0?'pos':'s','لو اشتريت كل خامة من الأرخص')}${kpi('أفضل مورد جودة/سعر',best?esc(best[0]):'-','s','تقييم ÷ مؤشر السعر')}</div>
 <div class="card"><h3 style="margin-top:0">تقييم الموردين</h3>${tbl(['المورد','تقييم الجودة (1-5)','مدة السداد (يوم)','عدد الخامات الأرخص','مؤشر السعر (1 = الأرخص)','عدد الارتفاعات','جودة مقابل السعر','مستحق عليك'],S.sup.map(s=>{const c=I.sc[s.name];return [`<b>${esc(s.name)}</b>`,`<input type="number" step="0.5" min="1" max="5" data-srate="${esc(s.name)}" value="${s.rating}" style="width:70px">`,`<input type="number" data-sterms="${esc(s.name)}" value="${s.terms}" style="width:70px">`,c.cheap,N(c.idx,2),`<span class="${c.rises?'wr':''}">${c.rises}</span>`,`<b class="${best&&best[0]===s.name?'pos':''}">${N(c.value,2)}</b>`,M(S.inv.filter(v=>v.supplier===s.name&&v.status==='approved'&&v.paid===false).reduce((a,v)=>a+invTotal(v),0))]}))}</div>
 <div class="card"><h3 style="margin-top:0">أسعار كل خامة عند كل مورد (للوحدة الأساسية)</h3><div class="tw"><table><tr><th>الخامة</th><th>المورد الحالي</th>${S.sup.map(s=>`<th>${esc(s.name)}</th>`).join('')}<th>الأرخص</th><th>توفير شهري</th><th></th></tr>
 ${I.rows.map(r=>`<tr><td><b>${esc(r.g.name)}</b></td><td>${esc(r.g.supplier)}<div class="note">${N(r.g.cost,3)}</div></td>${S.sup.map(s=>{const q=r.qs.find(x=>x.sup===s.name);if(!q)return '<td>-</td>';const ch=q.prev?(q.price-q.prev)/q.prev*100:0;return `<td><input type="number" step="any" style="width:80px" data-qt="${r.g.id}:${esc(s.name)}" value="${q.price}"><div class="note ${ch>=5?'neg':ch<=-5?'pos':''}">${ch>=0.5?'↑':ch<=-0.5?'↓':'='} ${N(Math.abs(ch),1)}%</div></td>`}).join('')}<td><b class="pos">${esc(r.best.sup)}</b><div class="note">${N(r.best.price,3)}</div></td><td class="${r.sv>0?'pos':''}">${M(r.sv)}</td><td>${r.best.sup!==r.g.supplier?`<button class="b g sm" data-act="setSup" data-ing="${r.g.id}" data-sup="${esc(r.best.sup)}">حوّل للأرخص</button>`:'✓'}</td></tr>`).join('')}</table></div>
 <div class="note">تعديل السعر هنا يسجّل السعر السابق ويحسب نسبة التغير. «حوّل للأرخص» يغيّر المورد المعتمد للخامة؛ تتحدث التكلفة فعليًا عند اعتماد أول فاتورة منه.</div></div>`};

// ---- invoices
V.inv=()=>{if(!draft)draft={supplier:'مورد A',date:today(),lines:[{ing:S.ing[0].id,qty:1,unit:1000,total:0}],img:null};
 const sup=[...new Set(S.ing.map(i=>i.supplier))];
 const lines=draft.lines.map((l,i)=>{const g=ING(l.ing);const cf=l.conf?`<span class="tag ${l.conf<.85?'neg':'pos'}">ثقة ${Math.round(l.conf*100)}%</span>`:'';
  return `<tr><td><select data-d="ing" data-i="${i}">${S.ing.map(x=>`<option value="${x.id}"${x.id===l.ing?' selected':''}>${esc(x.name)}</option>`).join('')}</select></td>
  <td><input type="number" step="any" data-d="qty" data-i="${i}" value="${l.qty}"></td>
  <td><select data-d="unit" data-i="${i}">${UNITS[g.unit].map(u=>`<option value="${u[1]}"${+l.unit===u[1]?' selected':''}>${u[0]}</option>`).join('')}</select></td>
  <td><input type="number" step="any" data-d="total" data-i="${i}" value="${l.total}"></td><td>${cf}</td><td><button class="b r sm" data-act="delLine" data-i="${i}">×</button></td></tr>`}).join('');
 const pend=S.inv.slice().reverse();
 return `<h2>الفواتير الذكية</h2><p class="sub">صوّر الفاتورة أو أدخلها، راجع، ثم اعتمد: يتحدث المخزون وتكلفة الخامات وتتحدث تكلفة كل وصفة تلقائيًا.</p>
 <div class="card"><div class="row"><label>المورد<select data-d="supplier">${sup.map(s=>`<option${s===draft.supplier?' selected':''}>${esc(s)}</option>`).join('')}</select></label>
 <label>التاريخ<input type="date" data-d="date" value="${draft.date}"></label>
 <label>صورة الفاتورة<input type="file" accept="image/*" id="invImg"></label>
 <button class="b g" data-act="ocr">⚡ قراءة بالذكاء الاصطناعي (محاكاة)</button></div>
 ${draft.img?`<img src="${draft.img}" style="max-height:140px;border-radius:8px;margin-bottom:8px">`:''}
 <div class="tw"><table><tr><th>الصنف</th><th>الكمية</th><th>الوحدة</th><th>الإجمالي (ج.م)</th><th></th><th></th></tr>${lines}</table></div>
 <div class="row" style="margin-top:10px"><button class="b g" data-act="addLine">+ سطر</button><button class="b" data-act="saveInv">حفظ للمراجعة</button></div>
 <div class="note">القراءة الذكية هنا محاكاة لإظهار شاشة المراجعة؛ في النسخة الإنتاجية يربط OCR حقيقي. لا تُعتمد أي فاتورة قبل المراجعة البشرية.</div></div>
 <div class="card"><h3 style="margin-top:0">سجل الفواتير</h3><div class="tw"><table><tr><th>التاريخ</th><th>المورد</th><th>البنود</th><th>الإجمالي</th><th>الحالة</th><th></th></tr>
 ${pend.map(v=>`<tr><td>${v.date}</td><td>${esc(v.supplier)}</td><td>${v.lines.map(l=>esc(ING(l.ing)?.name)+' '+N(l.qty*l.unit)+UL[ING(l.ing)?.unit]).join('، ')}</td><td>${M(v.lines.reduce((a,l)=>a+l.total,0))}</td>
 <td>${v.status==='pending'?'<span class="tag wr">قيد المراجعة</span>':v.status==='approved'?'<span class="tag pos">معتمدة</span>':'<span class="tag neg">مرفوضة</span>'}${v.dup?' <span class="tag neg">مكررة؟</span>':''}</td>
 <td>${v.status==='pending'?`<button class="b sm" data-act="appr" data-id="${v.id}">اعتماد</button> <button class="b r sm" data-act="rej" data-id="${v.id}">رفض</button>`:''}</td></tr>`).join('')||'<tr><td colspan=6 class="note">لا توجد فواتير</td></tr>'}</table></div></div>`};

// ---- stock
V.stock=()=>{const po=poList(),pr=stockPred(),wl=S.waste.slice().reverse().slice(0,15);
 return `<h2>الخامات والمخزون</h2><p class="sub">الرصيد النظري يتحدث من الفواتير والمبيعات. حدّد الحد الأدنى لكل خامة؛ عند الوصول إليه يظهر تحذير وتُكتب طلبية بالكمية الناقصة تلقائيًا.</p>
 ${Object.keys(po).length?`<div class="card" style="border-top:4px solid var(--bad)"><h3 style="margin-top:0">🛒 طلبية الشراء المقترحة (خامات نزلت عن الحد الأدنى)</h3>${Object.entries(po).map(([s,l])=>`<div class="card" style="margin:8px 0"><b>${esc(s)}</b><table>${l.map(x=>`<tr><td>${esc(x.g.name)}</td><td>الرصيد ${fq(x.g.stock,x.g.unit)}</td><td>الحد الأدنى ${fq(x.g.min,x.g.unit)}</td><td><b>اطلب ${fq(x.qty,x.g.unit)}</b></td></tr>`).join('')}</table><div class="row"><button class="b sm" data-act="copyPO" data-s="${esc(s)}">نسخ الطلبية</button><button class="b g sm" data-act="waPO" data-s="${esc(s)}">إرسال واتساب</button></div></div>`).join('')}<div class="note">الكمية = الحد الأدنى − الرصيد الحالي، وتتحدث تلقائيًا عند كل بيع.</div></div>`:'<div class="card"><span class="pos">✓ كل الخامات فوق الحد الأدنى — لا توجد طلبية مطلوبة</span></div>'}
 <div class="card"><div class="tw"><table><tr><th>الخامة</th><th>الوحدة</th><th>الرصيد النظري</th><th>الحد الأدنى (قابل للتعديل)</th><th>الحالة</th><th>تكلفة الوحدة الخام</th><th>Yield %</th><th>تكلفة الوحدة الصالحة</th><th>المورد</th><th>جرد فعلي</th></tr>

 <div class="card"><h3 style="margin-top:0">🗑 تسجيل هالك</h3><div class="row"><label>الفرع<select id="wb">${S.branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></label><label>الخامة<select id="wi">${S.ing.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></label><label>الكمية (وحدة أساسية)<input type="number" id="wq"></label><label>السبب<input id="wr" value="تلف"></label><button class="b" data-act="addWaste">تسجيل</button></div>

 <div class="card"><h3 style="margin-top:0">وصفة جديدة</h3><div class="row"><label>الاسم<input id="nr_n"></label><label>الفئة<input id="nr_c" value="باستا"></label><button class="b" data-act="addRec">إنشاء</button></div></div>`};

// ---- pricing
V.price=()=>{const ks=Object.keys(S.channels);const R=agg();return `<h2>التسعير الذكي</h2><p class="sub">السعر المقترح يغطي تكلفة الخامات والتغليف والتكاليف غير المباشرة (حصة الوحدة) والعمولة والتوصيل ويحقق الهامش المستهدف (من سعر البيع).</p>
 <div class="card row"><label>الهامش المستهدف %<input type="number" id="tg" value="${S.target}"></label><button class="b g" data-act="setTarget">تحديث</button></div>
 ${S.rec.map(r=>{const c=recCost(r).total,o=ovhU(R,r.id);return `<div class="card"><b>${esc(r.name)}</b> <span class="note">مباشرة ${N(c,2)} + غير مباشرة ${N(o,2)} = ${N(c+o,2)}</span><div class="tw"><table><tr><th>القناة</th><th>السعر الحالي</th><th>عمولة</th><th>صافي بعد العمولة</th><th>ربح مباشر</th><th>ربح بعد غير المباشر</th><th>الهامش الكامل</th><th>السعر المقترح (تكلفة كاملة)</th><th>سعر قاعدة 30%</th></tr>
 ${ks.map(k=>{const ch=S.channels[k],p=r.prices[k],disc=k==='app'?5:0,net=chanNet(p,k,disc),pr=net-c-ch.del,pf=pr-o,m=p?pf/p*100:0;
  const kf=(1-disc/100)*(1-ch.comm/100),sug=kf-S.target/100>0?(c+o+ch.del)/(kf-S.target/100):NaN;
  return `<tr><td>${ch.name}</td><td><input type="number" data-pr="${r.id}:${k}" value="${p}"></td><td>${ch.comm}%</td><td>${N(net,1)}</td><td class="${pr<0?'neg':''}">${N(pr,1)}</td><td class="${pf<0?'neg':''}">${N(pf,1)}</td><td class="${m<S.target?(m<=0?'neg':'wr'):'pos'}">${P(m)}</td><td><b>${isFinite(sug)?N(Math.ceil(sug/5)*5):'-'}</b> <button class="b g sm" data-act="applySug" data-r="${r.id}" data-k="${k}" data-v="${isFinite(sug)?Math.ceil(sug/5)*5:''}">اعتماد</button></td><td>${(1-disc/100)>0?N(Math.ceil(c/(0.30*(1-disc/100))/5)*5):'-'}</td></tr>`}).join('')}</table></div></div>`}).join('')}
 <div class="note">سعر قاعدة 30%: السعر الذي تكون عنده التكلفة المباشرة (خامات وتغليف) 30% من سعر البيع بعد الخصم؛ والعمولة والتوصيل تُحسب ضمن المصروفات غير المباشرة. الخصم على قناة التطبيقات 5% مفترض في الحساب. المنتج لا يجب أن يحقق مبيعات عالية وهو يخسر.</div>`};

 <div class="card"><h3 style="margin-top:0">آخر المبيعات المسجلة</h3><table>${recent.map(s=>`<tr><td>${s.date}</td><td>${S.channels[s.ch].name}</td><td>${s.canc&&!s.items.length?'طلب ملغى ×'+s.canc:s.items.map(i=>esc(REC(i.rid)?.name)+'×'+i.qty).join('، ')}</td><td>${M(saleCalc(s).gross)}</td></tr>`).join('')||'<tr><td class="note">لم تُسجل مبيعات يدوية بعد</td></tr>'}</table></div>`};

V.exp=()=>{const ex=S.exp.slice().sort((a,b)=>b.date.localeCompare(a.date));

 return `<h2>المصروفات</h2><p class="sub">ثابتة ومتغيرة وتشغيلية، تدخل مباشرة في قائمة الأرباح والخسائر ونقطة التعادل. المرتبات تُحسب تلقائيًا من تبويب الرواتب. مصروف «المركز المشترك» يُوزع على الفروع بحصة مبيعاتها.</p>

// ---- menu engineering
V.me=()=>{const R=agg();const rows=S.rec.map(r=>({r,...(R.byRec[r.id]||{qty:0,rev:0,cm:0})}));const tq=rows.reduce((a,x)=>a+x.qty,0),tc=rows.reduce((a,x)=>a+x.cm,0);const avg=tc/(tq||1),thr=.7/rows.length;
 rows.forEach(x=>{x.u=x.qty?x.cm/x.qty:0;const hs=x.qty/(tq||1)>=thr,hp=x.u>=avg;x.cls=hs&&hp?'Stars':hs?'Plowhorses':hp?'Puzzles':'Dogs';if(x.u<=0)x.cls='Dogs'});
 const adv={Stars:'حافظ على الجودة وروّج لها',Plowhorses:'ارفع السعر قليلًا أو خفّض التكلفة/الجرامات',Puzzles:'حسّن ظهورها بالمنيو وسوّق لها',Dogs:'راجع الوصفة والسعر أو أوقف الصنف'};
 return `<h2>تحليل المنيو (Menu Engineering)</h2><p class="sub">التصنيف من المبيعات الفعلية والمساهمة بعد العمولة والتكلفة. ${per()}</p>
 <div class="card tw"><table><tr><th>الصنف</th><th>الكمية</th><th>المبيعات</th><th>المساهمة الكلية</th><th>مساهمة الوحدة</th><th>غير مباشرة</th><th>صافي بعد التكلفة الكاملة</th><th>التصنيف</th><th>التوصية</th></tr>
 ${rows.sort((a,b)=>b.cm-a.cm).map(x=>`<tr><td><b>${esc(x.r.name)}</b></td><td>${N(x.qty)}</td><td>${M(x.rev)}</td><td class="${x.cm<0?'neg':''}">${M(x.cm)}</td><td>${N(x.u,1)}</td><td>${M(x.ovh||0)}</td><td class="${(x.full||0)<0?'neg':'pos'}">${M(x.full||0)}</td><td><span class="tag ${x.cls==='Stars'?'pos':x.cls==='Dogs'?'neg':'wr'}">${x.cls}</span></td><td>${adv[x.cls]}</td></tr>`).join('')}</table></div>`};

 if(/تكلفة|خامات/.test(ql)){const p=S.plog.slice(-5).map(x=>`${x.name} ${P(x.pct)}`).join('، ');return `نسبة تكلفة الخامات ${P(R.fcp)}. ${p?'آخر تغيرات الأسعار: '+p:'لا توجد تغيرات أسعار مسجلة بعد؛ اعتمد فاتورة بسعر مختلف لترى الأثر.'}`}
 return 'أستطيع الإجابة عن: الأرباح، المنتجات الخاسرة، أعلى الأصناف، عمولات التطبيقات، نقطة التعادل، المخزون، تكلفة الخامات. جرّب أحد الأزرار.'}
V.ai=()=>{const qs=['إيه الإجراءات المهمة النهاردة؟','ليه أرباحي قلت؟','إيه المنتجات اللي بخسر فيها؟','فين تسريب الأرباح؟','معايا كاش كام وإيه التزاماتي؟','هقفل الشهر على كام؟','هبيع كام بكرة؟','الفراخ والموزاريلا هتخلص إمتى؟','أرخص مورد مين؟','لو قللت 2 موظفين هوفر كام؟','هل أزود أسعار المنيو 5%؟','هل أفتح فرع جديد؟','هل أوقف التعامل مع التطبيق؟','إيه أفضل وأضعف فرع؟','الموظف بيكلفني كام؟','إيه نقطة التعادل؟','هل عمولة التطبيقات بتضرني؟','أنا كسبت كام؟','إيه أكتر الأصناف ربحًا؟','تكلفة الخامات عاملة إزاي؟'];
 return `<h2>🤖 مساعد المطعم الذكي (AI Restaurant Manager)</h2><p class="sub">يجيب من أرقام المحرك المالي فقط، مع ذكر الفترة والمصدر ولا يختلق أرقامًا. اضغط سؤالًا لفتح إجابته، واضغطه مرة أخرى (أو ✕) لإغلاقها.</p>
 <div class="card"><div class="row">${qs.map(q=>`<button class="b g sm${chat[0]&&chat[0].q===q?' on':''}" data-act="ask" data-q="${q}">${q}</button>`).join('')}</div>
 ${chat.map(c=>`<div class="chat"><div class="row" style="justify-content:space-between;margin:0 0 6px;align-items:center"><b>${esc(c.q)}</b><button class="b g sm" data-act="closeChat">✕ إغلاق</button></div><div>${c.a}</div></div>`).join('')}
 <div class="row"><input id="aq" placeholder="اسأل عن مطعمك…" style="flex:1"><button class="b" data-act="askTxt">إرسال</button></div>
 <div class="note">تُفسَّر الأسئلة بقواعد على بياناتك الحالية؛ ربط نموذج لغوي يتم في النسخة الإنتاجية فوق نفس المحرك.</div></div>`};

// ---- simulator
V.sim=()=>{const R=agg();return `<h2>محاكي القرارات (What-If)</h2><p class="sub">غيّر أي رقم وشاهد أثره على الربح ونقطة التعادل.</p>
 <div class="card"><div class="grid"><label class="k">رفع الأسعار %<input type="number" id="s1" value="0"></label><label class="k">تغير المبيعات %<input type="number" id="s2" value="20"></label><label class="k">عمولة التطبيقات (نقطة)<input type="number" id="s3" value="0"></label><label class="k">تغير سعر الخامات %<input type="number" id="s4" value="0"></label><label class="k">تغير المصروفات الثابتة %<input type="number" id="s5" value="0"></label><label class="k">تحويل % من التطبيق للمباشر<input type="number" id="s6" value="0"></label></div></div>
 <div class="card" id="simOut"></div>`};
A.sim_init=()=>{const R=agg();const f=()=>{const g=id=>+$('#'+id).value||0;
 const price=1+g('s1')/100,vol=1+g('s2')/100,dc=g('s3'),fc=1+g('s4')/100,fx=1+g('s5')/100,mv=g('s6')/100;
 const a=R.byCh.app,d=R.byCh.direct,o={...R.byCh};
 // volume & price
 let rev=0,cogs=0,comm=0,del=0;
 for(const k in R.byCh){let b={...R.byCh[k]};let r=b.rev,cg=b.cogs,dl=b.del;
  if(k==='app'){const mv_r=r*mv;r-=mv_r;cg-=cg*mv;dl-=dl*mv}
  if(k==='direct'){r+=a.rev*mv;cg+=a.cogs*mv;dl+=a.del*mv*0+ (S.channels.direct.del? a.rev*mv/Math.max(1,a.rev)*0:0)}
  const cm=S.channels[k].comm+(k==='app'?dc:0);
  rev+=r*price*vol;cogs+=cg*vol*fc;comm+=r*price*vol*cm/100;del+=dl*vol}
 const varx=R.varx*vol,fixed=R.fixed*fx,net=rev-cogs-comm-del-varx-fixed-R.shrink,cmr=rev?(rev-cogs-comm-del-varx)/rev:0,be=cmr>0?(fixed+R.shrink)/cmr:NaN;
 const d2=net-R.net;
 $('#simOut').innerHTML=`<div class="grid">${kpi('المبيعات',M(rev))}${kpi('صافي الربح الجديد',M(net),net>=0?'pos':'neg')}${kpi('الفرق عن الحالي',(d2>=0?'+':'')+M(d2),d2>=0?'pos':'neg')}${kpi('نقطة التعادل',isFinite(be)?M(be):'-','s')}</div>
 <div class="al ${d2>=0?'i':'c'}">${d2>=0?'السيناريو يحسّن الربح':'السيناريو يضعف الربح'} — ${Math.abs(d2)<1?'بلا تغير يُذكر':'بفارق '+M(Math.abs(d2))} خلال ${S.settings.period} يوم. <span class="note">افتراضات: الخامات تتحرك مع الحجم، والمصروفات المتغيرة بنفس نسبة الحجم، التحويل للمباشر يحتفظ بتكلفة التوصيل الحالية للطلب المباشر.</span></div>`};
 document.querySelectorAll('#s1,#s2,#s3,#s4,#s5,#s6').forEach(e=>e.oninput=f);f()};

// ---- settings
const FLD=[['targetSales','هدف مبيعات الشهر (ج.م)'],['targetNet','هدف صافي الربح الشهري (ج.م)'],['settleDays','أيام تسوية التطبيقات'],['payDay','يوم صرف المرتبات من الشهر'],['rentDay','يوم سداد الإيجار'],['hours','ساعات التشغيل يوميًا'],['commOk','عمولة التطبيقات المقبولة %'],['discMax','أقصى خصم مسموح %'],['capacity','سعة موظف التشغيل (طلب/يوم)'],['workDays','أيام عمل الموظف/شهر'],['shiftHours','ساعات الوردية'],['lead','مدة التوريد (يوم)']];
V.set=()=>`<h2>الإعدادات</h2><p class="sub">قنوات البيع والعمولات وفترة التحليل.</p>
 <div class="card"><div class="row"><label>فترة التحليل (يوم)<select id="sp">${[7,14,30].map(n=>`<option${n===S.settings.period?' selected':''}>${n}</option>`).join('')}</select></label></div>
 <div class="tw"><table><tr><th>القناة</th><th>عمولة %</th><th>تكلفة توصيل للطلب</th></tr>${Object.entries(S.channels).map(([k,c])=>`<tr><td>${c.name}</td><td><input type="number" data-cc="${k}:comm" value="${c.comm}"></td><td><input type="number" data-cc="${k}:del" value="${c.del}"></td></tr>`).join('')}</table></div>
 <h3>الأهداف والإعدادات التشغيلية</h3><div class="row">${FLD.map(f=>`<label>${f[1]}<input type="number" data-st="${f[0]}" value="${S.settings[f[0]]??''}"></label>`).join('')}</div>
 <h3>الحدود المسموحة للمصروفات (% من المبيعات) — تظهر تحذيرات عند تجاوزها</h3><div class="row"><label>أقصى تكلفة خامات %<input type="number" id="fcl" value="${S.settings.fcLimit||33}"></label><label>أدنى هامش صافٍ للصنف الأكثر مبيعًا %<input type="number" id="mmg" value="${S.settings.minMargin||15}"></label></div><div class="tw"><table><tr><th>البند</th><th>الحد الأقصى %</th></tr>${ECATS.map(c=>`<tr><td>${c}</td><td><input type="number" step="any" data-lim="${c}" value="${limOf(c)}"></td></tr>`).join('')}</table></div>
 <h3>محرك توزيع كل بند غير مباشر</h3><div class="tw"><table><tr><th>البند</th><th>المحرك</th></tr>${ECATS.map(c=>`<tr><td>${c}</td><td><select data-drv="${c}">${Object.entries(DRV).map(([k,v])=>`<option value="${k}"${k===drvOf(c)?' selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}</table></div>
 <div class="row" style="margin-top:10px"><button class="b" data-act="saveSet">حفظ</button><button class="b r" data-act="reset">إعادة بيانات المطعم التجريبي</button></div>
 <div class="note">البيانات تُحفظ على جهازك في المتصفح فقط (لا خادم). النسخة الإنتاجية: قاعدة بيانات سحابية وصلاحيات وتعدد مطاعم.</div></div>`;

// ---------- actions ----------
document.addEventListener('click',e=>{
 if(e.target.id==='modal'){$('#modal').hidden=true;return}
 const kd=e.target.closest('[data-kd]');if(kd&&!e.target.closest('[data-act]')){$('#mbody').innerHTML=DETAIL[kd.dataset.kd]();$('#modal').hidden=false;return}
 const t=e.target.closest('[data-tab]');if(t)return go(t.dataset.tab);
 const b=e.target.closest('[data-act]');if(!b)return;const d=b.dataset;
 const a=d.act;
 if(a==='addLine'){draft.lines.push({ing:S.ing[0].id,qty:1,unit:1000,total:0});render()}
 else if(a==='delLine'){draft.lines.splice(+d.i,1);if(!draft.lines.length)draft.lines.push({ing:S.ing[0].id,qty:1,unit:1,total:0});render()}
 else if(a==='ocr'){draft.supplier='مورد A';draft.lines=[['chicken',10,1000,1200,.97],['mozz',5,1000,1650,.91],['pasta',20,1000,1000,.78],['cream',4,1000,600,.88]].map(x=>({ing:x[0],qty:x[1],unit:x[2],total:x[3],conf:x[4]}));render()}
 else if(a==='saveInv'){const ls=draft.lines.filter(l=>l.qty>0&&l.total>0);if(!ls.length)return alert('أدخل بندًا واحدًا على الأقل');
  const tot=ls.reduce((s,l)=>s+l.total,0);const dup=S.inv.some(v=>v.supplier===draft.supplier&&v.date===draft.date&&v.lines.reduce((s,l)=>s+l.total,0)===tot);
  S.inv.push({id:uid(),supplier:draft.supplier,date:draft.date,lines:ls.map(l=>({ing:l.ing,qty:+l.qty,unit:+l.unit,total:+l.total})),status:'pending',dup,img:null});draft=null;save();render()}
 else if(a==='appr'){const v=S.inv.find(x=>x.id===d.id);for(const l of v.lines){const g=ING(l.ing);const q=l.qty*l.unit,np=l.total/q;const old=g.last;
   g.cost=(g.stock*g.cost+q*np)/(g.stock+q);g.stock+=q;if(old&&Math.abs(np-old)/old>.02)S.plog.push({date:v.date,ing:g.id,name:g.name,old,new:np,pct:(np-old)/old*100});g.last=np;g.supplier=v.supplier}
  v.status='approved';v.paid=false;v.dueDate=addDays(v.date,supTerms(v.supplier));save();render()}
 else if(a==='rej'){S.inv.find(x=>x.id===d.id).status='rejected';save();render()}
 else if(a==='count'){let n=0;document.querySelectorAll('[data-cnt]').forEach(i=>{if(i.value==='')return;const g=ING(i.dataset.cnt),act=+i.value,theo=g.stock,diff=act-theo;
   if(diff===0)return;S.counts.push({date:today(),ing:g.id,name:g.name,unit:g.unit,theo,act,diff,pct:theo?diff/theo*100:0,val:diff*g.cost});g.stock=act;n++});save();render()}
 else if(a==='addIng'){const n=$('#ni_n').value.trim();if(!n)return;S.ing.push({id:uid(),name:n,unit:$('#ni_u').value,cost:+$('#ni_c').value||0,yield:100,stock:0,min:+$('#ni_m').value||0,supplier:$('#ni_s').value,last:+$('#ni_c').value||0});save();render()}
 else if(a==='delItem'){REC(d.r).items.splice(+d.k,1);save();render()}
 else if(a==='addItem'){const q=+document.querySelector(`[data-addq="${d.r}"]`).value;if(!q)return;REC(d.r).items.push({ing:document.querySelector(`[data-addsel="${d.r}"]`).value,qty:q});save();render()}
 else if(a==='delRec'){if(confirm('حذف الوصفة؟')){S.rec=S.rec.filter(r=>r.id!==d.r);save();render()}}
 else if(a==='addRec'){const n=$('#nr_n').value.trim();if(!n)return;S.rec.push({id:uid(),name:n,cat:$('#nr_c').value,items:[],prep:5,prices:{dine:0,direct:0,app:0}});save();render()}
 else if(a==='setTarget'){S.target=+$('#tg').value||30;save();render()}
 else if(a==='applySug'){if(!d.v)return;REC(d.r).prices[d.k]=+d.v;save();render()}
 else if(a==='cartAdd'){const c=cart.find(x=>x.rid===d.r);c?c.qty++:cart.push({rid:d.r,qty:1});render()}
 else if(a==='cartDel'){cart.splice(+d.i,1);render()}
 else if(a==='sell'){if(!cart.length)return;const ch=$('#pch').value,disc=+$('#pdisc').value||0;
   const items=cart.map(c=>({rid:c.rid,qty:c.qty,price:REC(c.rid).prices[ch],cost:recCost(REC(c.rid)).total}));
   for(const c of cart)for(const it of REC(c.rid).items){const g=ING(it.ing);g.stock-=c.qty*it.qty/(g.yield/100)}
   S.sales.push({id:uid(),date:today(),ch,items,disc,orders:1,br:$('#pbr').value});if(ch!=='app')S.cash.cash+=saleCalc(S.sales[S.sales.length-1]).gross;cart=[];save();render()}
 else if(a==='addExp'){const am=+$('#ea').value;if(!am)return;S.exp.push({id:uid(),date:$('#ed').value,cat:$('#ec').value,type:$('#et').value,amount:am,note:$('#en').value,ind:$('#ei').checked,br:$('#eb').value});{const src=$('#ep').value;if(src!=='none')S.cash[src]-=am}save();render()}
 else if(a==='delExp'){S.exp=S.exp.filter(x=>x.id!==d.id);save();render()}
 else if(a==='ask'){chat=(chat[0]&&chat[0].q===d.q)?[]:[{q:d.q,a:answer(d.q)}];render()}
 else if(a==='closeChat'){chat=[];render()}
 else if(a==='askTxt'){const q=$('#aq').value.trim();if(!q)return;chat=[{q,a:answer(q)}];render()}
 else if(a==='cancelOrder'){S.sales.push({id:uid(),date:today(),ch:$('#pch').value,br:$('#pbr').value,items:[],disc:0,orders:0,canc:+$('#cx_n').value||1,cancVal:+$('#cx_v').value||0});save();render()}
 else if(a==='closeModal'){$('#modal').hidden=true}
 else if(a==='planGo'){$('#modal').hidden=true;go(d.t)}
 else if(a==='saveCash'){S.cash.cash=+$('#cc').value||0;S.cash.bank=+$('#cb').value||0;save();render()}
 else if(a==='addDraw'){const am=+$('#da').value;if(!am)return;const src=$('#ds').value;S.draw.push({id:uid(),date:$('#dd').value,amount:am,src,note:$('#dn').value});S.cash[src]-=am;save();render()}
 else if(a==='delDraw'){const x=S.draw.find(y=>y.id===d.id);if(x)S.cash[x.src]+=x.amount;S.draw=S.draw.filter(y=>y.id!==d.id);save();render()}
 else if(a==='payInv'){const v=S.inv.find(x=>x.id===d.id),src=document.querySelector(`[data-ps="${d.id}"]`).value;S.cash[src]-=invTotal(v);v.paid=true;v.paidDate=today();save();render()}
 else if(a==='addOut'){const n=$('#on').value.trim(),am=+$('#oa').value;if(!n||!am)return;S.outside.push({id:uid(),name:n,amount:am});save();render()}
 else if(a==='delOut'){S.outside=S.outside.filter(o=>o.id!==d.id);save();render()}
 else if(a==='addWaste'){const q=+$('#wq').value;if(!q)return;const g=ING($('#wi').value);S.waste.push({id:uid(),date:today(),br:$('#wb').value,ing:g.id,qty:q,reason:$('#wr').value});g.stock=Math.max(0,g.stock-q);save();render()}
 else if(a==='delWaste'){const w=S.waste.find(x=>x.id===d.id);if(w)ING(w.ing).stock+=w.qty;S.waste=S.waste.filter(x=>x.id!==d.id);save();render()}
 else if(a==='copyPO'){const tx=poText(d.s);try{navigator.clipboard.writeText(tx);alert('تم نسخ الطلبية')}catch(e){prompt('انسخ الطلبية',tx)}}
 else if(a==='waPO'){window.open('https://wa.me/?text='+encodeURIComponent(poText(d.s)),'_blank')}
 else if(a==='setSup'){ING(d.ing).supplier=d.sup;save();render()}
 else if(a==='addBranch'){const n=$('#nb').value.trim();if(!n)return;S.branches.push({id:'b'+uid(),name:n});save();render()}
 else if(a==='addEmp'){const n=$('#en1').value.trim(),b=+$('#en4').value;if(!n||!b)return;S.emp.push({id:'e'+uid(),name:n,role:$('#en2').value,br:$('#en3').value,base:b,allow:+$('#en5').value||0,inc:0,otH:0,abs:0,adv:0});save();render()}
 else if(a==='delEmp'){S.emp=S.emp.filter(e=>e.id!==d.id);save();render()}
 else if(a==='saveSet'){S.settings.period=+$('#sp').value;document.querySelectorAll('[data-st]').forEach(i=>S.settings[i.dataset.st]=+i.value||0);S.settings.fcLimit=+$('#fcl').value||33;S.settings.minMargin=+$('#mmg').value||15;S.settings.limits={};document.querySelectorAll('[data-lim]').forEach(i=>S.settings.limits[i.dataset.lim]=+i.value||0);S.settings.drv={};document.querySelectorAll('[data-drv]').forEach(i=>S.settings.drv[i.dataset.drv]=i.value);document.querySelectorAll('[data-cc]').forEach(i=>{const[k,f]=i.dataset.cc.split(':');S.channels[k][f]=+i.value||0});save();render()}
 else if(a==='reset'){if(confirm('سيتم مسح بياناتك وإعادة بيانات المطعم التجريبي. متابعة؟')){S=seed();save();draft=null;cart=[];chat=[];render()}}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.pd){S.planDone=S.planDone||{};S.planDone[t.dataset.pd]=t.checked;save();render();return}
 if(t.dataset.min){ING(t.dataset.min).min=+t.value||0;save();render();return}
 if(t.dataset.srate){S.sup.find(s=>s.name===t.dataset.srate).rating=clamp(+t.value||3,1,5);save();render();return}
 if(t.dataset.sterms){S.sup.find(s=>s.name===t.dataset.sterms).terms=+t.value||0;save();render();return}
 if(t.dataset.qt){const[id,sp]=t.dataset.qt.split(':');const q=S.quotes[id].find(x=>x.sup===sp),np=+t.value||q.price;if(np!==q.price){q.prev=q.price;q.price=np;const g=ING(id);if(sp===g.supplier&&np>q.prev)S.plog.push({date:today(),ing:id,name:g.name,old:q.prev,new:np,pct:(np-q.prev)/q.prev*100})}save();render();return}
 if(t.id==='pch'){draftCh=t.value;render();return}
 if(t.id==='brSel'){S.settings.br=t.value;save();render();return}
 if(t.id==='pbr'){draftBr=t.value;return}
 if(t.id==='insp'){S.settings.ins=+t.value||0;save();render();return}
 if(t.dataset.emp){const[i,f]=t.dataset.emp.split(':');S.emp.find(e=>e.id===i)[f]=+t.value||0;save();render();return}
 if(t.id==='invImg'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{draft.img=fr.result;render()};fr.readAsDataURL(t.files[0]);return}
 if(t.dataset.d==='ing'){draft.lines[+t.dataset.i].ing=t.value;draft.lines[+t.dataset.i].unit=UNITS[ING(t.value).unit][0][1];render();return}
 if(t.dataset.pr){const[r,k]=t.dataset.pr.split(':');REC(r).prices[k]=+t.value||0;save();render();return}
 if(t.dataset.prep){REC(t.dataset.prep).prep=+t.value||0;save();render();return}
 if(t.dataset.rq){const[r,k]=t.dataset.rq.split(':');REC(r).items[+k].qty=+t.value||0;save();render();return}
 if(t.dataset.ey){ING(t.dataset.ey).yield=Math.max(1,Math.min(100,+t.value||100));save();render()}
});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.d;if(!k||!draft)return;
 if(k==='supplier'||k==='date'){draft[k]=t.value;return}
 if(t.dataset.i!==undefined&&k!=='ing')draft.lines[+t.dataset.i][k]=+t.value||0});
render();
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').hidden=true});
</script></body></html>

function secToday(){const sh=branchShares(),sug=[];

function dailyMix(){const R=agg('all');const rs=MENU().map(r=>({id:r.id,v:(R.byRec[r.id]||{}).rev||0}));let tt=rs.reduce((a,x)=>a+x.v,0);let mix=tt?rs.filter(x=>x.v/tt>=.02):rs.map(x=>({id:x.id,v:1}));tt=mix.reduce((a,x)=>a+x.v,0)||1;return mix.map(x=>[x.id,x.v/tt])}

function salesAgg(d1,d2){const o={byCh:{},byBr:{},byRec:{},byDay:{},rev:0,ord:0,canc:0,cancVal:0};const add=(m,k,r,q,od)=>{const x=m[k]||(m[k]={rev:0,ord:0,qty:0,canc:0,cv:0});x.rev+=r;x.ord+=od;x.qty+=q;return x};
 for(const s of salesIn(d1,d2)){const c=saleCalc(s),od=s.orders!==undefined?s.orders:Math.round(c.units/UPO());o.rev+=c.gross;o.ord+=od;o.canc+=s.canc||0;o.cancVal+=s.cancVal||0;
  for(const [m,k] of [[o.byCh,s.ch],[o.byBr,s.br],[o.byDay,s.date]]){const x=add(m,k,c.gross,c.units,od);x.canc+=s.canc||0;x.cv+=s.cancVal||0}

function secFlow(R){const cat=c=>R.byCat[c]||0,rent=cat('إيجار'),sal=cat('مرتبات'),util=cat('كهرباء ومياه وغاز'),other=Math.max(0,R.fixed+R.varx-rent-sal-util);
 const segs=[['خامات وهالك',R.cogs+R.shrink,'#0f7a4d'],['مرتبات',sal,'#1c7ed6'],['إيجار',rent,'#e8590c'],['عمولات وتوصيل',R.comm+R.del,'#c92a2a'],['كهرباء ومرافق',util,'#f59f00'],['مصاريف أخرى',other,'#868e96'],['صافي الربح',Math.max(0,R.net),'#37b24d']];
 const tot=Math.max(R.rev,segs.reduce((a,s)=>a+s[1],0))||1;let cum=0;
 const circ=segs.map(s=>{const len=s[1]/tot*100;const c=`<circle class="seg" r="15.9155" cx="21" cy="21" fill="none" stroke="${s[2]}" stroke-width="6" data-len="${len}" style="stroke-dasharray:0 100;stroke-dashoffset:${-cum}"><title>${s[0]}</title></circle>`;cum+=len;return c}).join('');
 return `<div class="card"><h3 style="margin-top:0">💸 أين تذهب أموالي؟ (Money Flow)</h3><div class="note">كل 100 جنيه مبيعات بتتوزع كده:</div>
 <div class="row" style="align-items:center;gap:20px"><svg viewBox="0 0 42 42" class="donut" style="width:210px;height:210px;color:var(--ink)"><g transform="rotate(-90 21 21)">${circ}</g><text x="21" y="21" text-anchor="middle" font-size="4" fill="currentColor" font-weight="800">100 جنيه</text><text x="21" y="25.5" text-anchor="middle" font-size="2.4" fill="var(--mute)">مبيعات</text></svg>
 <table style="flex:1;min-width:260px">${segs.map(s=>`<tr><td><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${s[2]}"></span> ${s[0]}</td><td><b>${N(R.rev?s[1]/R.rev*100:0,1)}</b> جنيه</td><td class="note">${M(s[1])}</td></tr>`).join('')}</table></div>
 ${R.net<0?'<div class="al c">المطعم يخسر: المصروفات أكبر من المبيعات.</div>':''}</div>`}
function secLeak(R){const L=leakage(R);return `<div class="card"><h3 style="margin-top:0">🕳 تسريب الأرباح (Profit Leakage)</h3><div class="note">فلوس بتضيع من غير ما تاخد بالك (محسوبة شهريًا):</div>
 <table>${L.items.slice().sort((a,b)=>b.v-a.v).map(x=>`<tr><td>${x.n}<div class="note">${x.t}</div></td><td class="${x.v>0?'neg':''}"><b>${M(x.v)}</b></td></tr>`).join('')}</table>
 <div class="al ${L.total>0?'c':'i'}" style="margin-top:8px;font-size:16px"><b>أنت بتفقد ${M(L.total)} شهريًا بسبب تسريبات الأرباح.</b></div></div>`}

 <div class="al ${loss?'c':ok?'i':''}">${loss?'⚠ متوقع تقفل الشهر بخسارة '+M(-F.net):ok?'✓ متوقع تحقق التارجت: صافي ربح '+M(F.net):'متوقع تحقق مبيعات '+M(F.proj)+' وصافي ربح '+M(F.net)+' بنهاية الشهر — أقل من التارجت بـ '+M(F.tgN-F.net)}</div>
 <h3>🎯 المبيعات المطلوبة بكرة</h3>

 <div class="note">مطلوب لتحقيق صافي ربح ${M(F.tgN)} هذا الشهر: ${isFinite(D.need)?M(D.need):'-'} مبيعات. غيّر الأهداف من الإعدادات.</div></div>`}

function secProducts(R){const rows=S.rec.map(r=>({r,...(R.byRec[r.id]||{})})).filter(x=>x.qty);const mg=x=>x.rev?x.full/x.rev*100:0;
 const lst=(a,f)=>a.slice(0,3).map((x,i)=>`<div class="row" style="margin:2px 0;justify-content:space-between"><span>${i+1}. ${esc(x.r.name)}</span><b>${f(x)}</b></div>`).join('')||'<div class="note">—</div>';
 const box=(t,l,c)=>`<div class="card" style="margin:0"><div class="k" style="margin-bottom:6px;color:${c};font-weight:700">${t}</div>${l}</div>`;
 const byF=rows.slice().sort((a,b)=>b.full-a.full),byM=rows.slice().sort((a,b)=>mg(b)-mg(a)),byQ=rows.slice().sort((a,b)=>b.qty-a.qty),byC=rows.slice().sort((a,b)=>b.cogs/b.qty-a.cogs/a.qty);
 let par='';for(const a of byQ)for(const b of byF){if(b.qty<a.qty&&b.full>a.full&&(!par||b.full-a.full>par.d))par={d:b.full-a.full,a,b}}
 return `<div class="card"><h3 style="margin-top:0">🏆 المنتجات اللي بتكسبك فعلاً (Product Profit Ranking)</h3>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">${box('💰 أعلى إجمالي ربح',lst(byF,x=>M(x.full)),'var(--ok)')}${box('📈 أعلى هامش ربح',lst(byM,x=>P(mg(x))),'var(--ok)')}${box('🔥 أعلى مبيعات',lst(byQ,x=>N(x.qty)+' وحدة'),'var(--brand)')}${box('📉 أقل ربحية',lst(byF.slice().reverse(),x=>M(x.full)+' · '+P(mg(x))),'var(--bad)')}${box('🏭 أعلى تكلفة تصنيع',lst(byC,x=>N(x.cogs/x.qty,1)+' ج.م ('+P(x.rev?x.cogs/x.rev*100:0)+')'),'var(--warn)')}</div>
 ${par?`<div class="al w" style="margin-top:10px">💡 <b>${esc(par.a.r.name)}</b> باع ${N(par.a.qty)} وحدة وربحه ${M(par.a.full)}، بينما <b>${esc(par.b.r.name)}</b> باع ${N(par.b.qty)} فقط وربحه ${M(par.b.full)} — الأكثر مبيعًا مش دايمًا الأكثر ربحًا.</div>`:''}</div>`}
function secOpp(R){const rows=S.rec.map(r=>({r,...(R.byRec[r.id]||{})})).filter(x=>x.qty),nm=R.rev?R.net/R.rev:0;
 const opp=rows.map(x=>({...x,dp:.1*x.cm,nm2:(R.net+.1*x.cm)/(R.rev+.1*x.rev),up:x.cm/x.rev>nm})).sort((a,b)=>b.dp-a.dp);

 const rows=[];let row=[],cur='',q=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===delim){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}

function buildSales(rows){if(rows.length<2)return {err:'الملف فارغ أو بدون صفوف بيانات'};const mp=colMap(rows[0]),miss=[];if(mp.date<0)miss.push('التاريخ');if(mp.item<0)miss.push('الصنف');if(mp.qty<0)miss.push('الكمية');if(miss.length)return {err:'أعمدة ناقصة في الملف: '+miss.join('، ')+'. نزّل النموذج واستخدم نفس العناوين.'};

 for(const r of rows.slice(1)){const dt=parseDate(r[mp.date]),nm=String(r[mp.item]||'').trim();if(!dt||!nm)continue;const rec=matchRec(nm,items);if(!rec){unk[nm]=(unk[nm]||0)+1;continue}

const STMAP={date:SYN.date,order:SYN.order,gross:['gross','amount','total','إجماليالطلب','المبلغ','قيمةالطلب','الإجمالي','اجمالي','إجمالي','سعرالطلب'],comm:['commission','fee','العمولة','عمولة','commissionamount'],payout:['payout','net','netpayout','nettransfer','transfer','صافيالتحويل','المحول','صافي','netamount']};
function buildStmt(rows){if(rows.length<2)return {err:'الملف فارغ'};const mp=colMap(rows[0],STMAP);if(mp.gross<0||mp.comm<0)return {err:'لازم يكون في عمود إجمالي الطلب وعمود العمولة. نزّل النموذج.'};

 for(const r of rows.slice(1)){const gr=num(r[mp.gross]);if(!gr)continue;const cm=num(r[mp.comm]),exp=gr*pct/100,diff=cm-exp,dt=mp.date>=0?parseDate(r[mp.date]):'';g+=gr;e+=exp;d+=cm;if(dt)dts.push(dt);let flag='';

 <div class="card"><h3 style="margin-top:0">أسعار كل خامة عند كل مورد (للوحدة الأساسية)</h3><div class="tw"><table><tr><th>الخامة</th><th>المورد الحالي</th>${S.sup.map(s=>`<th>${esc(s.name)}</th>`).join('')}<th>الأرخص</th><th>توفير شهري</th><th></th></tr>
 ${I.rows.map(r=>`<tr><td><b>${esc(r.g.name)}</b></td><td>${esc(r.g.supplier)}<div class="note">${N(r.g.cost,3)}</div></td>${S.sup.map(s=>{const q=r.qs.find(x=>x.sup===s.name);if(!q)return '<td>-</td>';const ch=q.prev?(q.price-q.prev)/q.prev*100:0;return `<td><input type="number" step="any" style="width:80px" data-qt="${r.g.id}:${esc(s.name)}" value="${q.price}"><div class="note ${ch>=5?'neg':ch<=-5?'pos':''}">${ch>=0.5?'↑':ch<=-0.5?'↓':'='} ${N(Math.abs(ch),1)}%</div></td>`}).join('')}<td><b class="pos">${esc(r.best.sup)}</b><div class="note">${N(r.best.price,3)}</div></td><td class="${r.sv>0?'pos':''}">${M(r.sv)}</td><td>${r.best.sup!==r.g.supplier?`<button class="b g sm" data-act="setSup" data-ing="${r.g.id}" data-sup="${esc(r.best.sup)}">حوّل للأرخص</button>`:'✓'}</td></tr>`).join('')}</table></div>

 ${pend.map(v=>`<tr><td>${v.date}</td><td>${esc(v.supplier)}</td><td>${v.lines.map(l=>esc(ING(l.ing)?.name)+' '+N(l.qty*l.unit)+UL[ING(l.ing)?.unit]).join('، ')}</td><td>${M(v.lines.reduce((a,l)=>a+l.total,0))}</td>

 ${S.ing.map(i=>`<tr><td><b>${esc(i.name)}</b></td><td>${UL[i.unit]}</td><td class="${i.min>0&&i.stock<=i.min?'neg':''}">${N(i.stock)}</td>${S.branches.map(b=>{const q=(i.stockBy||{})[b.id]||0;return `<td class="${q<i.min*(sh[b.id]||0)?'neg':''}">${N(q)}</td>`}).join('')}<td><input type="number" style="width:90px" data-min="${i.id}" value="${i.min}"></td><td class="${i.min>0&&i.stock<i.min?'neg':i.min>0&&i.stock===i.min?'wr':'pos'}">${i.min>0&&i.stock<i.min?'تحت الحد — اطلب '+fq(i.min-i.stock,i.unit):i.stock===i.min?'عند الحد':'آمن'}</td><td><input type="number" step="any" style="width:80px" data-cost="${i.id}" value="${+i.cost.toFixed(4)}"></td><td><input type="number" style="width:70px" data-ey="${i.id}" value="${i.yield}"></td><td>${N(unitCost(i),3)}</td><td>${esc(i.supplier)}</td><td><input type="number" data-cnt="${i.id}" placeholder="${N(i.stock)}"></td>${xfTd('ing',i)}</tr>`).join('')}</table></div>
 <div class="row" style="margin-top:10px"><button class="b" data-act="count">اعتماد الجرد</button></div></div>
 <div class="card"><h3 style="margin-top:0">📦 توقع نفاد المخزون (Smart Inventory Prediction)</h3>${tbl(['الخامة','الاستهلاك اليومي','الرصيد','تنفد خلال','تاريخ النفاد','اشتري للأسبوع','هل يكفي الأسبوع؟'],pr.filter(x=>x.dq>0).map(x=>[`<b>${esc(x.g.name)}</b>`,fq(x.dq,x.g.unit),fq(x.g.stock,x.g.unit),`<span class="${x.days<3?'neg':x.days<7?'wr':'pos'}">${N(x.days,1)} يوم</span>`,x.date,x.need7>0?'<b>'+fq(x.need7,x.g.unit)+'</b>':'—',x.days>=7+(S.settings.lead||2)?'<span class="pos">نعم</span>':'<span class="neg">لا</span>']))}<div class="note">من متوسط الاستهلاك الفعلي لآخر ${S.settings.period} يوم (كل الفروع) مع مدة توريد ${S.settings.lead||2} يوم.</div></div>

 for(const part of adg(txt).split(/[,،\n;؛]+|\sو\s/).map(s=>s.trim()).filter(Boolean)){
  let m=part.match(/^(\d+(?:\.\d+)?)\s*[x×*]?\s*(.+)$/i),q,nm;if(m){q=+m[1];nm=m[2]}else{m=part.match(/^(.+?)\s*[x×*]?\s*(\d+(?:\.\d+)?)$/i);if(m){nm=m[1];q=+m[2]}}

  if(!c.length)bad.push(part);else out.push({r:c[0],q,alts:c.slice(1)})}

// ---- menu engineering
V.me=()=>{const R=agg();const rows=MENU().map(r=>({r,...(R.byRec[r.id]||{qty:0,rev:0,cm:0})}));const tq=rows.reduce((a,x)=>a+x.qty,0),tc=rows.reduce((a,x)=>a+x.cm,0);const avg=tc/(tq||1),thr=.7/rows.length;
 rows.forEach(x=>{x.u=x.qty?x.cm/x.qty:0;const hs=x.qty/(tq||1)>=thr,hp=x.u>=avg;x.cls=hs&&hp?'Stars':hs?'Plowhorses':hp?'Puzzles':'Dogs';if(x.u<=0)x.cls='Dogs'});
 const adv={Stars:'حافظ على الجودة وروّج لها',Plowhorses:'ارفع السعر قليلًا أو خفّض التكلفة/الجرامات',Puzzles:'حسّن ظهورها بالمنيو وسوّق لها',Dogs:'راجع الوصفة والسعر أو أوقف الصنف'};
 return `<h2>تحليل المنيو (Menu Engineering)</h2><p class="sub">التصنيف من المبيعات الفعلية والمساهمة بعد العمولة والتكلفة. ${per()}</p>
 <div class="card tw"><table><tr><th>الصنف</th><th>الكمية</th><th>المبيعات</th><th>المساهمة الكلية</th><th>مساهمة الوحدة</th><th>غير مباشرة</th><th>صافي بعد التكلفة الكاملة</th><th>التصنيف</th><th>التوصية</th></tr>
 ${rows.sort((a,b)=>b.cm-a.cm).map(x=>`<tr><td><b>${esc(x.r.name)}</b></td><td>${N(x.qty)}</td><td>${M(x.rev)}</td><td class="${x.cm<0?'neg':''}">${M(x.cm)}</td><td>${N(x.u,1)}</td><td>${M(x.ovh||0)}</td><td class="${(x.full||0)<0?'neg':'pos'}">${M(x.full||0)}</td><td><span class="tag ${x.cls==='Stars'?'pos':x.cls==='Dogs'?'neg':'wr'}">${x.cls}</span></td><td>${adv[x.cls]}</td></tr>`).join('')}</table></div>`};

// ---- branches
V.br=()=>{const rows=S.branches.map(b=>({b,R:agg(b.id)})).sort((a,b)=>b.R.net-a.R.net);const all=agg('all');
 const diag=x=>{const R=x.R;if(!R.rev)return '—';const dp=(R.cogs+R.shrink)/R.rev*100,ip=(R.fixed+R.varx+R.comm+R.del)/R.rev*100,o=[];if(dp>RULE()[0])o.push('المباشر '+P(dp));if(ip>RULE()[1])o.push('غير المباشر '+P(ip));if(R.labp>limOf('مرتبات'))o.push('العمالة '+P(R.labp));return o.length?'أعلى من الهدف: '+o.join('، '):'ضمن الهدف'};
 const cells=R=>`<td>${M(R.rev)}</td><td>${P(R.fcp)}</td><td>${M(R.comm+R.del)}</td><td>${M(R.fixed+R.varx)}</td><td>${P(R.labp)}</td><td class="${R.net<0?'neg':'pos'}"><b>${M(R.net)}</b></td><td>${R.rev?P(R.net/R.rev*100):'-'}</td>`;
 const best=rows[0],worst=rows[rows.length-1];
 return `<h2>الفروع</h2><p class="sub">مقارنة أداء الفروع. مصروفات المركز المشترك تُوزع على الفروع بحصة مبيعاتها، والمرتبات من تبويب الرواتب. ${per()}</p>
 <div class="card tw"><table><tr><th>الفرع</th><th>المبيعات</th><th>تكلفة الخامات</th><th>عمولات+توصيل</th><th>مصروفات</th><th>Labor %</th><th>صافي الربح</th><th>% من المبيعات</th></tr>
 ${rows.map(x=>`<tr><td><b>${esc(x.b.name)}</b></td>${cells(x.R)}</tr>`).join('')}<tr><th>الإجمالي</th>${cells(all)}</tr></table></div>
 ${rows.length>1?`<div class="grid"><div class="card"><div class="k">أفضل فرع</div><div class="v s pos">${esc(best.b.name)}</div><div class="note">${M(best.R.net)}</div></div><div class="card"><div class="k">أضعف فرع</div><div class="v s ${worst.R.net<0?'neg':'wr'}">${esc(worst.b.name)}</div><div class="note">${M(worst.R.net)}</div></div></div>`:''}
 <div class="card"><h3 style="margin-top:0">تشخيص كل فرع مقابل قاعدة ${RULE().join('/')}</h3>${rows.map(x=>`<div class="al ${x.R.net<0?'c':''}"><b>${esc(x.b.name)}</b>: ${diag(x)}</div>`).join('')}<div class="note">للتفصيل اختر الفرع من القائمة الجانبية وافتح اللوحة.</div></div>
 <div class="card"><h3 style="margin-top:0">إضافة فرع</h3><div class="row"><label>اسم الفرع<input id="nb"></label><button class="b" data-act="addBranch">إضافة</button></div><div class="note">المخزون والوصفات والأسعار مشتركة بين الفروع في هذه النسخة؛ المبيعات والمصروفات والرواتب لكل فرع.</div></div>`};

// ---- payroll
V.pay=()=>{const br=S.settings.br||'all';const em=S.emp.filter(e=>br==='all'||e.br===br);
 const num=(e,f,w=80)=>`<input type="number" style="width:${w}px" data-emp="${e.id}:${f}" value="${e[f]}">`;
 const T=em.reduce((a,e)=>{const x=empParts(e);a.gross+=x.gross;a.net+=x.net;a.cost+=x.cost;return a},{gross:0,net:0,cost:0});
 const R=agg();
 return `<h2>الرواتب والعمالة</h2><p class="sub">تكلفة العمالة الشهرية تدخل تلقائيًا في المصروفات والأرباح وتوزع على الأصناف بوقت التحضير. ${per()}</p>
 <div class="grid">${kpi('عدد الموظفين',N(em.length))}${kpi('إجمالي الاستحقاقات الشهرية',M(T.gross),'s')}${kpi('صافي المدفوع للموظفين',M(T.net),'s')}${kpi('تكلفة الشركة الشهرية',M(T.cost),'s')}${kpi('Labor Cost من المبيعات',P(R.labp),R.labp>25?'neg':'pos')}</div>
 <div class="card tw"><table><tr><th>الموظف</th><th>الوظيفة</th><th>الفرع</th><th>أساسي</th><th>بدلات</th><th>حوافز</th><th>إضافي (ساعة)</th><th>غياب (يوم)</th><th>سلف</th><th>استحقاق</th><th>صافي مدفوع</th><th>تكلفة الشركة</th>${xfTh('emp')}<th></th></tr>
 ${em.map(e=>{const x=empParts(e);return `<tr><td><b>${esc(e.name)}</b></td><td>${esc(e.role)}</td><td>${esc(brN(e.br))}</td><td>${num(e,'base')}</td><td>${num(e,'allow',70)}</td><td>${num(e,'inc',70)}</td><td>${num(e,'otH',60)}</td><td>${num(e,'abs',60)}</td><td>${num(e,'adv',70)}</td><td>${M(x.gross)}</td><td><b>${M(x.net)}</b></td><td>${M(x.cost)}</td>${xfTd('emp',e)}<td><button class="b r sm" data-act="delEmp" data-id="${e.id}">×</button></td></tr>`}).join('')||'<tr><td colspan=13 class="note">لا يوجد موظفون</td></tr>'}</table></div>
 <div class="note">الإضافي = ساعة × (الأساسي÷30÷8) × 1.5. الغياب = يوم × (الأساسي÷30). السلف تُخصم من صافي المدفوع ولا تدخل في تكلفة الشركة. تكلفة الفترة = الشهري × ${S.settings.period}/30.</div>
 <div class="card"><h3 style="margin-top:0">تكلفة العمالة لكل فرع</h3><table><tr><th>الفرع</th><th>موظفون</th><th>تكلفة شهرية</th><th>Labor % من المبيعات</th></tr>${S.branches.map(b=>{const l=S.emp.filter(e=>e.br===b.id);return `<tr><td>${esc(b.name)}</td><td>${l.length}</td><td>${M(l.reduce((a,e)=>a+empCost(e),0))}</td><td>${P(agg(b.id).labp)}</td></tr>`}).join('')}<tr><td>المركز (إدارة)</td><td>${S.emp.filter(e=>!e.br).length}</td><td>${M(S.emp.filter(e=>!e.br).reduce((a,e)=>a+empCost(e),0))}</td><td>يوزع على الفروع</td></tr></table></div>
 <div class="card"><h3 style="margin-top:0">إضافة موظف</h3><div class="row"><label>الاسم<input id="en1"></label><label>الوظيفة<input id="en2" value="طباخ"></label><label>الفرع<select id="en3"><option value="">المركز</option>${S.branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></label><label>الأساسي<input type="number" id="en4"></label><label>البدلات<input type="number" id="en5" value="0"></label><button class="b" data-act="addEmp">إضافة</button></div>
 <div class="row"><label>تأمينات صاحب العمل % من الأساسي<input type="number" id="insp" value="${S.settings.ins||0}"></label></div></div>
 ${empProdBlock()}`};

// ---- AI advisor (rule-based on engine)
let chat=[];
function answer(q){const R=agg();const rows=MENU().map(r=>({r,...(R.byRec[r.id]||{qty:0,rev:0,cm:0})})).sort((a,b)=>b.cm-a.cm);
 const ql=q.toLowerCase();
 if(/ليه.*(قلت|قل |نزل|انخفض|تراجع)|(قلت|نزلت|انخفضت|تراجعت).*(ارباح|أرباح|ربح)/.test(ql)){const c=winAgg(daysAgo(14),today()),pv=winAgg(daysAgo(29),daysAgo(15)),cm=x=>x.rev-x.cogs-x.comm-x.del,cmr0=pv.rev?cm(pv)/pv.rev:0;
   const ds=[['حجم المبيعات',(c.rev-pv.rev)*cmr0],['تكلفة الخامات',-((c.cogs/(c.rev||1))-(pv.cogs/(pv.rev||1)))*c.rev],['العمولات والتوصيل',-(((c.comm+c.del)/(c.rev||1))-((pv.comm+pv.del)/(pv.rev||1)))*c.rev]].sort((a,b)=>a[1]-b[1]);
   return `آخر 15 يومًا مقابل 15 قبلها: المبيعات ${M(c.rev)} مقابل ${M(pv.rev)} (${P(pv.rev?(c.rev-pv.rev)/pv.rev*100:0)})، تكلفة الخامات ${P(c.rev?c.cogs/c.rev*100:0)} مقابل ${P(pv.rev?pv.cogs/pv.rev*100:0)}، متوسط الفاتورة ${M(c.orders?c.rev/c.orders:0)} مقابل ${M(pv.orders?pv.rev/pv.orders:0)}. المساهمة قبل الثابتة: ${M(cm(c))} مقابل ${M(cm(pv))}. ${ds[0][1]<-1?'أكبر سبب في النزول: <b>'+ds[0][0]+'</b> ('+M(ds[0][1])+')':'لا يوجد تراجع واضح؛ الربح مستقر أو أفضل'}. المصروفات الثابتة لم تتغير. <span class="note">المصدر: المبيعات الفعلية لآخر 30 يومًا.</span>`}
 if(/(قلل|أقلل|اقلل|خفض|اخفض|اشيل|أشيل).*(موظف|عمال|عامل)|(موظفين|عمال).*(قلل|اقلل|أقلل|خفض)/.test(ql)){const n=+(ql.match(/\d+/)||[1])[0],ep=empProd(S.settings.br||'all'),avg=ep.ops.length?ep.ops.reduce((a,e)=>a+empCost(e),0)/ep.ops.length:0,left=Math.max(0,ep.ops.length-n);
   return `تخفيض ${n} موظف تشغيل يوفر نحو <b>${M(n*avg)}</b> شهريًا (متوسط تكلفة الموظف ${M(avg)}). يتبقى ${left} موظف مقابل احتياج الطلبات ${ep.req}: ${left>=ep.req?'كافٍ حسب السعة المفترضة':'⚠ أقل من الاحتياج وسيتأثر زمن التحضير والخدمة'}.`}
 if(/(ازود|أزود|ارفع|أرفع|زود).*(سعر|أسعار|اسعار|المنيو)|(سعر|أسعار|اسعار|المنيو).*(ازود|أزود|ارفع|أرفع)/.test(ql)){const pc=+(ql.match(/\d+/)||[5])[0],pf=1+pc/100,vf=1-pc*(S.settings.elasticity??.6)/100,n1=R.rev*pf*vf-R.cogs*vf-R.comm*pf*vf-R.del*vf-R.varx-R.fixed-R.shrink;
   return `لو رفعت أسعار المنيو ${pc}% (مع افتراض فقد ${P(pc*(S.settings.elasticity??.6))} من الطلبات): صافي الربح من ${M(R.net)} إلى <b>${M(n1)}</b> (${n1>=R.net?'+':''}${M(n1-R.net)}). ${n1>R.net?'الزيادة مجدية؛ ابدأ بالأصناف الأكثر مبيعًا وهامشها ضعيف.':'غير مجدية بهذا الافتراض.'} <span class="note">افتراض مرونة الطلب ${S.settings.elasticity??.6}.</span>`}
 if(/(افتح|أفتح|فتح).*فرع|فرع جديد/.test(ql)){const k=K(),rs=S.branches.map(b=>agg(b.id)).filter(x=>x.rev),avgNet=rs.reduce((a,x)=>a+x.net,0)/(rs.length||1)*k,avgFix=rs.reduce((a,x)=>a+x.fixed+x.shrink,0)/(rs.length||1)*k,C=cashPos(),lossy=rs.filter(x=>x.net<0).length,need=avgFix*3;
   return `متوسط صافي ربح الفرع الحالي ${M(avgNet)} شهريًا وتكاليفه الثابتة ${M(avgFix)}. الفرع الجديد عادةً يخسر أول 3 شهور (تقدير ${M(avgFix*1.5)} لو بلغ نصف المبيعات). السيولة ${M(C.liquid)} ${C.liquid>=need?'تغطي':'لا تغطي'} 3 شهور من تكاليفه (${M(need)}). ${lossy?'⚠ عندك '+lossy+' فرع يخسر؛ أصلحه أولًا. ':''}<b>${C.liquid>=need&&!lossy&&avgNet>0?'التوصية: ممكن بشرط دراسة الموقع.':'التوصية: لا تفتح الآن وركّز على تحسين الفروع الحالية.'}</b>`}
 if(/(اوقف|أوقف|وقف|اقفل|أقفل).*(تطبيق|منصة|طلبات)|(تطبيق|منصة).*(اوقف|أوقف|وقف)/.test(ql)){const a=R.byCh.app,d=R.byCh.direct;if(!a||!a.rev)return 'لا توجد مبيعات تطبيقات في الفترة.';const am=a.rev-a.cogs-a.comm-a.del,dp=d.rev?(d.rev-d.cogs-d.comm-d.del)/d.rev:.5,f=dp>0?am/(a.rev*dp):NaN;
   return `مساهمة التطبيق ${M(am)} (${P(am/a.rev*100)} من مبيعاته) بعد الخامات والعمولة. المصروفات الثابتة لن تنخفض لو أوقفته، فإيقافه يخسرك ${M(am)} إلا لو انتقل العملاء للمباشر؛ ولتعويض الخسارة لازم ينتقل نحو ${isFinite(f)?P(Math.min(f,9.99)*100):'-'} من طلباته للمباشر. <b>${am>0?'التوصية: لا توقفه؛ فاوض على العمولة وحوّل جزءًا للمباشر.':'التطبيق يخسر فعلًا؛ إيقافه يحسّن الربح.'}</b>`}
 if(/تسريب|بتضيع/.test(ql)){const L=leakage(R);return 'تسريبات الأرباح الشهرية: '+L.items.filter(x=>x.v>0).sort((a,b)=>b.v-a.v).map(x=>`${x.n} ${M(x.v)}`).join('، ')+`. <b>الإجمالي ${M(L.total)} شهريًا.</b>`}
 if(/كاش|سيولة|خزنة|مسحوب/.test(ql)){const C=cashPos(),dr=drawInfo(R);return `الكاش ${M(C.cash)} والبنك ${M(C.bank)}، فلوس بره ${M(C.outside)}، مستحق للموردين ${M(C.pay)}، التزامات 7 أيام ${M(C.o7)}. المسحوبات ${M(dr.d)} (${P(dr.pct)} من صافي الربح). ${C.after<0?'⚠ السيولة لا تغطي التزامات 30 يومًا.':'السيولة تغطي التزامات الشهر.'}`}
 if(/توقع|نهاية الشهر|هقفل/.test(ql)){const F=msForecast(R);return `متوقع مبيعات الشهر ${M(F.proj)} وصافي ربح ${M(F.net)} (الهدف ${M(F.tgN)}). ${F.net<0?'⚠ خسارة متوقعة.':F.net>=F.tgN?'✓ تحقق التارجت.':'أقل من التارجت بـ '+M(F.tgN-F.net)+'.'}`}
 if(/بكرة|هدف اليوم/.test(ql)){const D=dailyTarget(R,msForecast(R));return `محتاج تبيع بكرة <b>${M(D.req)}</b> (التعادل اليومي ${M(D.be)}): نحو ${isFinite(D.orders)?N(D.orders):'-'} طلب، أو متوسط فاتورة ${isFinite(D.ticket)?M(D.ticket):'-'}، أي ${M(D.hour)} كل ساعة.`}
 if(/هتخلص|نفاد|تكفي|هشتري|اشتري/.test(ql)){const pr=stockPred().filter(x=>x.dq>0).slice(0,4);return 'الأقرب للنفاد: '+pr.map(x=>`${x.g.name} ${N(x.days,1)} يوم (اشتري ${x.need7>0?fq(x.need7,x.g.unit):'لا حاجة'} للأسبوع)`).join('، ')}
 if(/أرخص|ارخص|مورد|موردين/.test(ql)){const I=supInfo(),tp=I.rows.filter(r=>r.sv>0).sort((a,b)=>b.sv-a.sv).slice(0,3);return `التوفير الشهري لو اشتريت من الأرخص: <b>${M(I.save)}</b>. أكبر الفرص: `+(tp.map(r=>`${r.g.name} من ${r.best.sup} (${M(r.sv)})`).join('، ')||'—')+'. راجع صفحة الموردين.'}
 if(/إنتاجية|بيكلفني|تكلفة الموظف/.test(ql)){const p=empProd(S.settings.br||'all');return `تكلفة الموظف ${M(p.perDay)} يوميًا، تكلفة العمالة لكل طلب ${N(p.laborOrder,1)} ج.م، ومبيعات كل ساعة عمل ${M(p.salesHour)}. ${p.exc?`عندك زيادة ${p.exc} موظف تشغيل عن احتياج الطلبات (${M(p.saving)} شهريًا).`:'عدد موظفي التشغيل مناسب.'}`}
 if(/خطة|إجراء|الإجراءات|أهم/.test(ql)){const P0=planActions(R);return P0.top.map((a,i)=>`${i+1}) ${esc(a.t)} ${a.imp>0?'(+'+M(a.imp)+')':''}`).join(' — ')+` — <b>إجمالي الفرص ${M(P0.total)}</b>.`}

function fTok(src){src=String(src||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/[،;؛]/g,',').replace(/×/g,'*').replace(/÷/g,'/').replace(/٪/g,'%');
 const t=[];let i=0;while(i<src.length){const c=src[i];if(/\s/.test(c)){i++;continue}
  if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(src[i+1]||''))){let j=i;while(j<src.length&&/[0-9.]/.test(src[j]))j++;t.push({k:'n',v:parseFloat(src.slice(i,j))});i=j;continue}

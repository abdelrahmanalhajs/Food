name: Build desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- --publish never
      - name: E2E on Linux (packaged app, xvfb)
        if: runner.os == 'Linux'
        working-directory: desktop
        env:
          APP_EXEC: ${{ github.workspace }}/desktop/dist/linux-unpacked/scope-desktop
          E2E_OUT: ${{ github.workspace }}/e2e-out
        run: xvfb-run -a node e2e/e2e.js
      - name: Install + E2E on Windows (silent installer, then installed app)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        env:
          E2E_OUT: ${{ github.workspace }}\e2e-out
        run: |
          $setup = Get-ChildItem dist\Scope-Setup-*.exe | Select-Object -First 1
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Scope\Scope.exe'
          for ($attempt = 1; $attempt -le 3 -and -not (Test-Path $exe); $attempt++) {
            Write-Host "Installing $($setup.Name) silently (attempt $attempt)"
            $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
            Write-Host ("Installer exit code: " + $p.ExitCode)
            $prev = -1
            for ($i = 0; $i -lt 45; $i++) { if (Test-Path $exe) { $sz = (Get-Item $exe).Length; if ($sz -eq $prev -and $sz -gt 1000000) { break }; $prev = $sz }; Start-Sleep -Seconds 2 }
            if (-not (Test-Path $exe)) {
              Write-Host "Not installed yet. Diagnostics:"
              Get-Process | Where-Object { $_.ProcessName -match 'Scope|Setup|nsis' } | ForEach-Object { Write-Host ("proc: " + $_.ProcessName + " " + $_.Id) }
              if (Test-Path "$env:LOCALAPPDATA\Programs") { Get-ChildItem "$env:LOCALAPPDATA\Programs" | ForEach-Object { Write-Host ("Programs: " + $_.FullName) } }
              Get-ChildItem $env:LOCALAPPDATA -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'Scope' } | ForEach-Object { Write-Host ("LocalAppData: " + $_.FullName) }
            }
          }
          if (-not (Test-Path $exe)) { Write-Error "Installed exe not found at $exe"; exit 1 }
          Write-Host "Installed at $exe"
          $env:APP_EXEC = $exe
          node e2e/e2e.js
      - name: E2E on Windows 32-bit build (ia32 via WOW64)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        env:
          E2E_OUT: ${{ github.workspace }}\e2e-out-ia32
        run: |
          $exe = (Resolve-Path 'dist\win-ia32-unpacked\Scope.exe').Path
          Write-Host "ia32 exe: $exe"
          $env:APP_EXEC = $exe
          node e2e/e2e.js
      - name: Install + E2E on macOS (dmg -> /Applications)
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          E2E_OUT: ${{ github.workspace }}/e2e-out
        run: |
          DMG=$(ls dist/Scope-*-Mac-universal.dmg | head -1)
          hdiutil attach "$DMG" -nobrowse -mountpoint /Volumes/ScopeInstall
          cp -R /Volumes/ScopeInstall/Scope.app /Applications/
          hdiutil detach /Volumes/ScopeInstall
          xattr -cr /Applications/Scope.app
          lipo -archs /Applications/Scope.app/Contents/MacOS/Scope || true
          APP_EXEC=/Applications/Scope.app/Contents/MacOS/Scope node e2e/e2e.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.os }}
          path: |
            e2e-out
            e2e-out-ia32
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: scope-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error
  cross-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-arm
            art: scope-windows-latest
            label: Windows ARM64
          - os: macos-15-intel
            art: scope-macos-latest
            label: macOS Intel x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test deps only
        working-directory: desktop
        run: npm install --no-audit --no-fund --ignore-scripts --no-save playwright-core
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.art }}
          path: inst
      - name: Windows ARM - install and E2E
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        env:
          E2E_OUT: ${{ github.workspace }}\e2e-out
        run: |
          Write-Host ("OS arch: " + $env:PROCESSOR_ARCHITECTURE)
          $setup = Get-ChildItem ..\inst\Scope-Setup-*.exe | Select-Object -First 1
          Write-Host ("Installer: " + $setup.FullName + " size " + $setup.Length)
          $exe0 = Join-Path $env:LOCALAPPDATA 'Programs\Scope\Scope.exe'
          for ($attempt = 1; $attempt -le 4 -and -not (Test-Path $exe0); $attempt++) {
            $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
            Write-Host ("Installer attempt $attempt exit code: " + $p.ExitCode)
            if (-not (Test-Path $exe0)) { Start-Sleep -Seconds 5 }
          }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Scope\Scope.exe'
          $prev = -1
          for ($i = 0; $i -lt 90; $i++) { if (Test-Path $exe) { $sz = (Get-Item $exe).Length; if ($sz -eq $prev -and $sz -gt 1000000) { break }; $prev = $sz }; Start-Sleep -Seconds 2 }
          if (-not (Test-Path $exe)) {
            Write-Host "Not at default path; searching..."
            $found = @()
            foreach ($root in @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)}, 'C:\Users')) { if ($root -and (Test-Path $root)) { $found += Get-ChildItem -Path $root -Recurse -Filter 'Scope.exe' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName } }
            $found | ForEach-Object { Write-Host ("FOUND: " + $_) }
            if ($found.Count -gt 0) { $exe = $found[0] }
          }
          if (-not (Test-Path $exe)) { Write-Error "not installed"; exit 1 }
          Write-Host ("Using: " + $exe)
          $env:APP_EXEC = $exe
          node e2e/e2e.js
      - name: macOS Intel - install and E2E
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          E2E_OUT: ${{ github.workspace }}/e2e-out
        run: |
          uname -m
          DMG=$(ls ../inst/Scope-*-Mac-universal.dmg | head -1)
          hdiutil attach "$DMG" -nobrowse -mountpoint /Volumes/ScopeInstall
          cp -R /Volumes/ScopeInstall/Scope.app /Applications/
          hdiutil detach /Volumes/ScopeInstall
          xattr -cr /Applications/Scope.app
          APP_EXEC=/Applications/Scope.app/Contents/MacOS/Scope node e2e/e2e.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.os }}
          path: e2e-out
          if-no-files-found: ignore
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: scope-*
          merge-multiple: true
      - name: Publish release desktop-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release delete desktop-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create desktop-latest out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Scope Desktop (latest build)" --notes "Installers for Windows (.exe), macOS (.dmg) and Linux (.AppImage/.deb). Unsigned builds: on Windows click More info > Run anyway; on macOS right-click > Open."

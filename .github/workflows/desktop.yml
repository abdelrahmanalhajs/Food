name: Build desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: scope-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release desktop-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release delete desktop-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create desktop-latest out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Scope Desktop (latest build)" --notes "Installers for Windows (.exe), macOS (.dmg) and Linux (.AppImage/.deb). Unsigned builds: on Windows click More info > Run anyway; on macOS right-click > Open."
